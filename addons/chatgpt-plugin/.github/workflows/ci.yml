name: CI

# Runs in the standalone mirror repo (nvdigitalsolutions/nvoos-chatgpt-plugin)
# after sync-chatgpt-plugin.yml force-pushes the subtree split of
# addons/chatgpt-plugin. Deliberately dependency-free: Node built-ins only,
# no npm install, so the mirror never needs a lockfile.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ '18', '20', '22' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate package (JSON, manifests, skills, marketplace)
        run: node bin/validate.mjs

      - name: Packaging smoke test
        run: |
          node bin/package-plugin.mjs /tmp/nvoos-site-bridge.zip
          test -s /tmp/nvoos-site-bridge.zip
