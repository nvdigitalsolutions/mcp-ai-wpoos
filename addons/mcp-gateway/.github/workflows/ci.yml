# ───────────────────────────────────────────────────────────
# NV oOS MCP Gateway — CI
#
# Colocated with the addon so the standalone mirror repo
# (nvdigitalsolutions/nvoos-mcp-gateway) gets the same gates as the
# monorepo path. Mirror push is owned by the root-repo workflow
# .github/workflows/sync-mcp-gateway.yml (media-worker pattern).
# ───────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Syntax check
        run: find src -name '*.js' -not -name '*.test.js' -print0 | xargs -0 -n1 node --check

      - name: Dependency audit
        run: npm audit --audit-level=high
