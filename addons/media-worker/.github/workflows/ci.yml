name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests do not launch a browser; skip the large Chromium download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Syntax check
        run: find src -name '*.js' -not -name '*.test.js' -print0 | xargs -0 -n1 node --check

      - name: Dependency audit
        run: npm audit --audit-level=high
