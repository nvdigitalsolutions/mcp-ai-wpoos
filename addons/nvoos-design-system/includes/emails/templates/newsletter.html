<!-- nds-email-wrapper:newsletter -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>{{subject}}</title>
<style>
  @media (prefers-color-scheme: dark) {
    .nds-page { background-color: var(--nds-email-page-bg-dark) !important; }
    .nds-card { background-color: var(--nds-email-card-bg-dark) !important; }
    .nds-body { color: var(--nds-email-body-text-dark) !important; }
    .nds-divider { border-color: var(--nds-email-divider-dark) !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:var(--nds-email-page-bg); font-family:var(--nds-email-font);">

<table class="nds-page" width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation" style="background-color:var(--nds-email-page-bg);">
  <tr>
    <td align="center" style="padding:40px 16px 48px;">

      <table class="nds-card" width="600" cellpadding="0" cellspacing="0" border="0" role="presentation" style="max-width:600px; width:100%; background-color:var(--nds-email-card-bg);">

        <!-- HEADER BAND -->
        <tr>
          <td style="background-color:var(--nds-email-header-bg); padding:36px 48px;">
            <h1 style="margin:0; font-family:var(--nds-email-font); font-size:24px; color:var(--nds-email-accent); font-weight:normal; letter-spacing:3px; line-height:1.2;">{{site_name}}</h1>
            <p style="margin:10px 0 0 0; font-family:var(--nds-email-font); font-size:12px; color:var(--nds-email-accent-2); letter-spacing:3px;">{{sub_brand}}</p>
          </td>
        </tr>

        <!-- TITLE -->
        <tr>
          <td style="padding:36px 48px 8px;">
            <h2 style="margin:0; font-family:var(--nds-email-font); font-size:22px; color:var(--nds-email-body-text); line-height:1.3;">{{subject}}</h2>
          </td>
        </tr>

        <!-- BODY -->
        <tr>
          <td style="padding:20px 48px 12px;">
            <div class="nds-body" style="font-family:var(--nds-email-font); font-size:var(--nds-email-body-size); line-height:var(--nds-email-body-height); color:var(--nds-email-body-text);">
              {{body}}
            </div>
          </td>
        </tr>

        <!-- CTA -->
        <tr>
          <td style="padding:16px 48px 32px;" align="center">
            {{button "Read More" "{{site_url}}"}}
          </td>
        </tr>

        <!-- FOOTER -->
        <tr>
          <td style="padding:20px 48px 28px; border-top:1px solid var(--nds-email-divider);">
            <p style="margin:0; font-family:var(--nds-email-font); font-size:11px; color:var(--nds-email-muted); line-height:1.8;">
              You are receiving this because you subscribed at <a href="{{site_url}}" style="color:var(--nds-email-accent-2); text-decoration:none;">{{site_domain}}</a>.
              &nbsp;·&nbsp; <a href="mailto:{{admin_email}}" style="color:var(--nds-email-accent-2); text-decoration:none;">Unsubscribe requests</a>
              &nbsp;·&nbsp; © {{year}} {{site_name}}
            </p>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
<!-- /nds-email-wrapper:newsletter -->
