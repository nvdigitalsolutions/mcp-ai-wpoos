codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 70%
        threshold: 5%
        if_ci_failed: error
    patch:
      default:
        target: 70%
        threshold: 5%

comment:
  layout: "reach,diff,flags,tree,reach"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "tests/**/*"
  - "bin/**/*"
  - "vendor/**/*"
  - "node_modules/**/*"
  - "assets/examples/**/*"
  - "*.md"

component_management:
  default_rules:
    statuses:
      - type: project
        target: 70%
      - type: patch
        target: 70%
  
  individual_components:
    - component_id: "core"
      name: "Core Plugin"
      paths:
        - "includes/class-*.php"
        - "mcp-ai-wpoos.php"
    
    - component_id: "tools"
      name: "AI Tools"
      paths:
        - "includes/tools/**/*.php"
    
    - component_id: "admin"
      name: "Admin Interface"
      paths:
        - "includes/admin/**/*.php"
    
    - component_id: "rest-api"
      name: "REST API"
      paths:
        - "includes/class-wp-mcp-ai-rest.php"
        - "includes/rest/**/*.php"
    
    - component_id: "integrations"
      name: "Integrations"
      paths:
        - "includes/integrations/**/*.php"

flags:
  phpunit:
    paths:
      - "includes/**/*.php"
    carryforward: true
  
  javascript:
    paths:
      - "assets/js/**/*.js"
    carryforward: true
