# ───────────────────────────────────────────────────────────
# oOS Engine — WordPress Plugin Development Environment
# ───────────────────────────────────────────────────────────
#
# Start:    docker compose up -d
# Testing:  docker compose --profile testing up -d
# Stop:     docker compose down
# Reset:    docker compose down -v && docker compose up -d
# WP-CLI:   docker compose run --rm wp-cli plugin list
# Logs:     docker compose logs -f wordpress
#
# Access:   http://localhost:8000
#           http://localhost:8000/wp-admin  (setup on first visit)
#
# Profiles:
#   default  — WordPress + MySQL only (lean dev env)
#   testing  — also installs WooCommerce, Elementor, Rank Math,
#              WPCode, JWT Login, JetFormBuilder, Newsletter,
#              and WP All Import via wp.org for integration tests
#   tools    — on-demand WP-CLI container

name: oos-wp

services:

  # ── Plugin Seed (profile: testing, installs integration plugins) ─
  wp-plugin-seed:
    image: wordpress:cli-php8.2
    container_name: oos-wp-plugin-seed
    profiles:
      - testing
    depends_on:
      wordpress:
        condition: service_started
    volumes:
      - wp_core:/var/www/html
      - .:/var/www/html/wp-content/plugins/mcp-ai-wpoos
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    # Run the install script inside the mounted plugin directory.
    # Override entrypoint so we don't conflict with the image's wp shim.
    entrypoint:
      - sh
      - -c
    command:
      - |
        echo "=== oOS: Installing test plugins ==="
        # Wait for WordPress to finish initializing its DB tables.
        # The WP-CLI image shares the core volume, but WordPress
        # (the main container) must have completed its first-run
        # setup before we can talk to the database reliably.
        until wp core is-installed --allow-root --path=/var/www/html 2>/dev/null; do
          echo "  Waiting for WordPress to be installed..."
          sleep 3
        done
        # Run the canonical install script (core tier).
        # Use --all in CI; omit for local dev unless explicitly wanted.
        chmod +x /var/www/html/wp-content/plugins/mcp-ai-wpoos/bin/install-test-plugins.sh
        /var/www/html/wp-content/plugins/mcp-ai-wpoos/bin/install-test-plugins.sh --all
        echo "=== Plugin seed complete ==="

  # ── WordPress Application Server ─────────────────────────
  wordpress:
    image: wordpress:6.9-php8.2-apache
    container_name: oos-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "true"
      WORDPRESS_CONFIG_EXTRA: |
        /* ── Development overrides ── */
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'WP_ENVIRONMENT_TYPE', 'development' );
        define( 'WP_MEMORY_LIMIT', '256M' );

        /* ── Plugin debug (must come after the plugin loads) ── */
        if ( ! defined( 'WP_MCP_AI_DEBUG' ) ) {
            define( 'WP_MCP_AI_DEBUG', true );
        }
    volumes:
      - wp_core:/var/www/html
      - .:/var/www/html/wp-content/plugins/mcp-ai-wpoos
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── MySQL 8.0 Database ──────────────────────────────────
  db:
    image: mysql:8.0
    container_name: oos-wp-db
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --max_allowed_packet=256M
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - wp_db:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -pwordpress
        - --ssl-mode=DISABLED
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ── WP-CLI (on-demand only, not auto-started) ──────────
  wp-cli:
    image: wordpress:cli-php8.2
    container_name: oos-wp-cli
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_core:/var/www/html
      - .:/var/www/html/wp-content/plugins/mcp-ai-wpoos
    working_dir: /var/www/html
    # No entrypoint override — use the image's built-in `wp` shim.
    # Run as:  docker compose run --rm wp-cli plugin list
    command: ["--info"]

volumes:
  wp_core:
  wp_db:
