# ───────────────────────────────────────────────────────────
# oOS Engine — WordPress Plugin Development Environment
# ───────────────────────────────────────────────────────────
#
# Start:    docker compose up -d
# Stop:     docker compose down
# Reset:    docker compose down -v && docker compose up -d
# WP-CLI:   docker compose run --rm wp-cli plugin list
# Logs:     docker compose logs -f wordpress
# Seed log: docker compose logs wp-plugin-seed
#
# Access:   http://localhost:8000
# Admin:    http://localhost:8000/wp-admin (admin / password)
# Worker:   http://localhost:3100/api/health
#
# Profiles:
#   default  — WordPress + MySQL + plugin seed (full dev env)
#   tools    — on-demand WP-CLI container
#
# Windows/WSL2: Docker Desktop runs inside the WSL2 VM.
# Volume mounts use relative paths (.) which Docker Desktop
# translates automatically.  If you need an absolute path,
# use WSL format (/mnt/c/...) not Windows drive letters.
#
# What the seed installs (idempotent, runs every start):
#   Core:    WooCommerce, Elementor, Rank Math, WPCode,
#            Simple JWT Login, JetFormBuilder
#   Extended:Newsletter, WP All Import

name: oos-wp

services:

  # ── Plugin Seed (auto-installs WP + integration plugins, idempotent) ─
  wp-plugin-seed:
    image: wordpress:cli-php8.2
    container_name: oos-wp-plugin-seed
    # The WordPress Apache image runs www-data as UID 33, but the CLI
    # image uses UID 82.  Align to the Apache image's UID so the seed
    # can write to the shared wp_core volume.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    volumes:
      - wp_core:/var/www/html
      - .:/var/www/html/wp-content/plugins/mcp-ai-wpoos
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # Must match the WordPress service's WORDPRESS_CONFIG_EXTRA so
      # the shared wp-config.php eval() picks up memory/debug defines.
      WORDPRESS_CONFIG_EXTRA: |
        /* ── Development overrides ── */
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'WP_ENVIRONMENT_TYPE', 'development' );
        define( 'WP_MEMORY_LIMIT', '512M' );

        /* ── Media Worker sidecar ── */
        define( 'WP_MEDIA_WORKER_URL', 'http://media-worker:3100' );

        /* ── Plugin debug (must come after the plugin loads) ── */
        if ( ! defined( 'WP_MCP_AI_DEBUG' ) ) {
            define( 'WP_MCP_AI_DEBUG', true );
        }
      # Belt-and-suspenders: also raise PHP's CLI memory limit
      # in case the constant-based ini_set hasn't fired yet.
      WP_CLI_PHP_ARGS: "-d memory_limit=512M"
    entrypoint:
      - sh
      - -c
    command:
      - |
        set -eu

        echo "=== oOS Plugin Seed ==="

        # ── Wait for WordPress filesystem ──────────────────
        echo "Waiting for wp-config.php..."
        until [ -f /var/www/html/wp-config.php ]; do
          sleep 2
        done
        echo "wp-config.php found."

        # ── Install WordPress (idempotent, with retries) ──
        if wp core is-installed --allow-root --path=/var/www/html 2>/dev/null; then
          echo "WordPress is already installed."
        else
          echo "Installing WordPress..."
          ATTEMPT=0
          until wp core install \
            --allow-root \
            --path=/var/www/html \
            --url="http://localhost:8000" \
            --title="NV oOS Dev" \
            --admin_user="admin" \
            --admin_password="password" \
            --admin_email="admin@oos.local" \
            --skip-email 2>/dev/null; do
            ATTEMPT=$$(( ATTEMPT + 1 ))
            if [ $$ATTEMPT -ge 10 ]; then
              echo "ERROR: wp core install failed after 10 attempts."
              exit 1
            fi
            echo "  Retrying... (attempt $$ATTEMPT)"
            sleep 3
          done
          echo "WordPress installed successfully."
        fi

        # ── Activate plugin & permalinks ──────────────────
        wp plugin activate mcp-ai-wpoos --allow-root --path=/var/www/html 2>/dev/null || true
        wp rewrite structure "/%postname%/" --hard --allow-root --path=/var/www/html 2>/dev/null || true

        # ── Install integration test plugins ──────────────
        echo "Installing integration test plugins..."
        SEED_SCRIPT="/var/www/html/wp-content/plugins/mcp-ai-wpoos/bin/install-test-plugins.sh"
        # Use bash explicitly (the script uses bash arrays; busybox sh
        # would choke).  Avoid chmod +x -- Windows host mounts don't
        # support Linux execute permissions.
        bash "$$SEED_SCRIPT" --all
        echo "=== Plugin seed complete ==="

  # ── WordPress Application Server ─────────────────────────
  wordpress:
    image: wordpress:6.9-php8.2-apache
    container_name: oos-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "true"
      WORDPRESS_CONFIG_EXTRA: |
        /* ── Development overrides ── */
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'WP_ENVIRONMENT_TYPE', 'development' );
        define( 'WP_MEMORY_LIMIT', '512M' );

        /* ── Media Worker sidecar ── */
        define( 'WP_MEDIA_WORKER_URL', 'http://media-worker:3100' );

        /* ── Plugin debug (must come after the plugin loads) ── */
        if ( ! defined( 'WP_MCP_AI_DEBUG' ) ) {
            define( 'WP_MCP_AI_DEBUG', true );
        }
    volumes:
      - wp_core:/var/www/html
      - .:/var/www/html/wp-content/plugins/mcp-ai-wpoos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Verify Apache is serving (WordPress install handled by seed).
      # Use a generous timeout — WordPress with many plugins can be slow.
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s

  # ── MySQL 8.0 Database ──────────────────────────────────
  db:
    image: mysql:8.0
    container_name: oos-wp-db
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --max_allowed_packet=256M
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - wp_db:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -pwordpress
        - --ssl-mode=DISABLED
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ── Media Worker Sidecar (offloads NPM packages) ────────
  media-worker:
    build:
      context: ./addons/media-worker
      dockerfile: Dockerfile
    container_name: oos-media-worker
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: development
      PORT: "3100"
    volumes:
      - ./addons/media-worker/src:/app/src:ro

  # ── WP-CLI (on-demand only, not auto-started) ──────────
  wp-cli:
    image: wordpress:cli-php8.2
    container_name: oos-wp-cli
    profiles:
      - tools
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        /* ── Development overrides ── */
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'WP_ENVIRONMENT_TYPE', 'development' );
        define( 'WP_MEMORY_LIMIT', '512M' );

        /* ── Media Worker sidecar ── */
        define( 'WP_MEDIA_WORKER_URL', 'http://media-worker:3100' );

        /* ── Plugin debug (must come after the plugin loads) ── */
        if ( ! defined( 'WP_MCP_AI_DEBUG' ) ) {
            define( 'WP_MCP_AI_DEBUG', true );
        }
      WP_CLI_PHP_ARGS: "-d memory_limit=512M"
    volumes:
      - wp_core:/var/www/html
      - .:/var/www/html/wp-content/plugins/mcp-ai-wpoos
    working_dir: /var/www/html
    # Use the image's built-in wp shim (no entrypoint override).
    # Run as:  docker compose run --rm wp-cli plugin list
    command: ["--path=/var/www/html", "--info"]

volumes:
  wp_core:
  wp_db:
