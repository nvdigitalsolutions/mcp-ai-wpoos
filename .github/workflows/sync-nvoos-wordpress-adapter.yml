name: Sync nvoos-wordpress-adapter

on:
  push:
    branches: [main, alpha-working]
    paths:
      - 'lib/wordpress-adapter/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split subtree
        run: |
          git subtree split --prefix=lib/wordpress-adapter --branch=nvoos-wordpress-adapter-split

      - name: Push to nvoos-wordpress-adapter
        run: |
          git config --local --unset-all http.https://github.com/.extraheader
          git push https://x-access-token:${{ secrets.NVOOS_WORDPRESS_ADAPTER_REPO_TOKEN }}@github.com/nvdigitalsolutions/nvoos-wordpress-adapter.git nvoos-wordpress-adapter-split:main --force
