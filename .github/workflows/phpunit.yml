name: PHPUnit

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_DB_NAME: wordpress_test
      WP_DB_USER: wordpress
      WP_DB_PASSWORD: wordpress
      WP_DB_HOST: 127.0.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: xdebug
          extensions: mbstring, mysqli
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Configure Composer GitHub token
        run: composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Configure WordPress test suite
        run: |
          bin/install-wp-tests.sh "$WP_DB_NAME" "$WP_DB_USER" "$WP_DB_PASSWORD" "$WP_DB_HOST" latest

      - name: Install optional test plugins
        run: |
          chmod +x bin/install-test-plugins.sh
          bash bin/install-test-plugins.sh || echo "Some test plugins could not be installed"
        continue-on-error: true

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Check coverage threshold
        run: |
          # Extract coverage percentage from coverage.xml
          if [ -f coverage.xml ]; then
            COVERAGE=$(php -r "
              \$xml = simplexml_load_file('coverage.xml');
              if (\$xml && isset(\$xml->project->metrics)) {
                \$metrics = \$xml->project->metrics;
                \$statements = (int)\$metrics['statements'];
                \$covered = (int)\$metrics['coveredstatements'];
                if (\$statements > 0) {
                  echo round((\$covered / \$statements) * 100, 2);
                } else {
                  echo '0';
                }
              } else {
                echo '0';
              }
            ")
            echo "Code coverage: ${COVERAGE}%"
            
            # Set minimum threshold (currently 70% based on gap analysis recommendation)
            THRESHOLD=70
            
            # Compare coverage to threshold (using awk for portability)
            if awk "BEGIN {exit !($COVERAGE < $THRESHOLD)}"; then
              echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
              echo "::warning::Code coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
              # Note: Not failing the build yet, just warning
              # Remove 'true ||' to enforce threshold
              true || exit 1
            else
              echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
            fi
          else
            echo "⚠️ No coverage.xml file found"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: phpunit
          name: phpunit-coverage
        continue-on-error: true
