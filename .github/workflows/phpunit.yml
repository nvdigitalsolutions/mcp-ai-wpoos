name: PHPUnit

# This workflow also serves as the full-suite alpha validation gate.
on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - '**.php'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - 'phpunit.xml.dist'
      - 'bin/install-wp-tests.sh'
      - 'bin/install-test-plugins.sh'
      - 'bin/find-untested-classes.sh'
      - '.github/workflows/phpunit.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_DB_NAME: wordpress_test
      WP_DB_USER: wordpress
      WP_DB_PASSWORD: wordpress
      WP_DB_HOST: 127.0.0.1
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DIR: /tmp/wordpress-tests-lib

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug
          extensions: mbstring, mysqli
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Configure Composer GitHub token
        run: composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Pro addon dependencies
        working-directory: addons/pro
        run: composer install --no-dev --no-interaction --prefer-dist --ignore-platform-req=ext-fileinfo --ignore-platform-req=ext-gd --ignore-platform-req=ext-zip

      - name: Configure WordPress test suite
        run: |
          bin/install-wp-tests.sh "$WP_DB_NAME" "$WP_DB_USER" "$WP_DB_PASSWORD" "$WP_DB_HOST" latest

      - name: Install optional test plugins
        # Downloads the wp.org plugins the integration tests exercise into
        # $WP_CORE_DIR/wp-content/plugins. The PHPUnit bootstrap require_once's
        # each plugin's main file from disk, so no wp-config.php or activation is
        # needed — the script detects that and unpacks the zips directly.
        #
        # Core tier only (no --all): the extended tier is Newsletter and WP All
        # Import, which no test depends on. The WP All Import tool tests in fact
        # assert the missing-plugin guard and skip when it is loaded, and its
        # models throw on the tables that only activation creates.
        run: |
          chmod +x bin/install-test-plugins.sh
          bash bin/install-test-plugins.sh || echo "Some test plugins could not be installed"
        continue-on-error: true

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Enforce per-subsystem coverage baseline
        # Gate added by PR #1 of the PHPUnit Test Coverage Gap-Filling Plan.
        # Compares the count of source classes referenced by at least one test
        # against the floors recorded in tests/.coverage-baseline.json. The
        # floors must only ratchet upward — never lower without a justification
        # in the PR description.
        run: bash bin/find-untested-classes.sh --check

      - name: Check coverage threshold
        run: |
          # Extract coverage percentage from coverage.xml
          if [ -f coverage.xml ]; then
            COVERAGE=$(php -r "
              \$xml = simplexml_load_file('coverage.xml');
              if (\$xml && isset(\$xml->project->metrics)) {
                \$metrics = \$xml->project->metrics;
                \$statements = (int)\$metrics['statements'];
                \$covered = (int)\$metrics['coveredstatements'];
                if (\$statements > 0) {
                  echo round((\$covered / \$statements) * 100, 2);
                } else {
                  echo '0';
                }
              } else {
                echo '0';
              }
            ")
            echo "Code coverage: ${COVERAGE}%"
            
            # Set minimum threshold (currently 70% based on gap analysis recommendation)
            THRESHOLD=70
            
            # Compare coverage to threshold (using awk for portability)
            # Note: Currently in warning-only mode. To enforce threshold and fail builds:
            # 1. Remove the 'true ||' prefix on the 'exit 1' line below
            # 2. Commit and test to ensure legitimate failures are acceptable
            if awk "BEGIN {exit !($COVERAGE < $THRESHOLD)}"; then
              echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
              echo "::warning::Code coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
              # Currently warning only - remove 'true ||' to enforce
              true || exit 1
            else
              echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
            fi
          else
            echo "⚠️ No coverage.xml file found"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: phpunit
          name: phpunit-coverage
        continue-on-error: true

      - name: Build production autoloader
        run: composer install --no-dev --prefer-dist --classmap-authoritative --no-interaction
