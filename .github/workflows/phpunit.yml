name: PHPUnit

# This workflow also serves as the full-suite alpha validation gate.
on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - '**.php'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - 'phpunit.xml.dist'
      - 'phpunit-basepro.xml.dist'
      - 'tests/basepro/**'
      - 'tests/database/**'
      - 'lib/core/**'
      - 'lib/laravel-adapter/**'
      - 'includes/database/**'
      - 'addons/pro/lib/database/**'
      - 'addons/pro/includes/tools/database/**'
      - 'docker-compose.yml'
      - 'bin/install-wp-tests.sh'
      - 'bin/install-test-plugins.sh'
      - 'bin/find-untested-classes.sh'
      - '.github/workflows/phpunit.yml'

permissions:
  contents: read

# A truncated test-file listing must never pass silently. tests/bootstrap.php
# compares the enumerable tests/*.php count against the SPL directory iterator
# PHPUnit discovers with and exits when they disagree. CI runners use a
# native ext4 checkout, so a shortfall here is a real regression and not the
# virtual-filesystem quirk that affects Docker Desktop bind mounts.
env:
  WP_MCP_AI_TESTS_STRICT_DISCOVERY: '1'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_DB_NAME: wordpress_test
      WP_DB_USER: wordpress
      WP_DB_PASSWORD: wordpress
      WP_DB_HOST: 127.0.0.1
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DIR: /tmp/wordpress-tests-lib

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug
          extensions: mbstring, mysqli
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Configure Composer GitHub token
        run: composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Pro addon dependencies
        working-directory: addons/pro
        run: composer install --no-dev --no-interaction --prefer-dist --ignore-platform-req=ext-fileinfo --ignore-platform-req=ext-gd --ignore-platform-req=ext-zip

      - name: Configure WordPress test suite
        run: |
          bin/install-wp-tests.sh "$WP_DB_NAME" "$WP_DB_USER" "$WP_DB_PASSWORD" "$WP_DB_HOST" latest

      - name: Install optional test plugins
        # Downloads the wp.org plugins the integration tests exercise into
        # $WP_CORE_DIR/wp-content/plugins. The PHPUnit bootstrap require_once's
        # each plugin's main file from disk, so no wp-config.php or activation is
        # needed — the script detects that and unpacks the zips directly.
        #
        # Core tier only (no --all): the extended tier is Newsletter and WP All
        # Import, which no test depends on. The WP All Import tool tests in fact
        # assert the missing-plugin guard and skip when it is loaded, and its
        # models throw on the tables that only activation creates.
        run: |
          chmod +x bin/install-test-plugins.sh
          bash bin/install-test-plugins.sh || echo "Some test plugins could not be installed"
        continue-on-error: true

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Enforce per-subsystem coverage baseline
        # Gate added by PR #1 of the PHPUnit Test Coverage Gap-Filling Plan.
        # Compares the count of source classes referenced by at least one test
        # against the floors recorded in tests/.coverage-baseline.json. The
        # floors must only ratchet upward — never lower without a justification
        # in the PR description.
        run: bash bin/find-untested-classes.sh --check

      - name: Check coverage threshold
        run: |
          # Extract coverage percentage from coverage.xml
          if [ -f coverage.xml ]; then
            COVERAGE=$(php -r "
              \$xml = simplexml_load_file('coverage.xml');
              if (\$xml && isset(\$xml->project->metrics)) {
                \$metrics = \$xml->project->metrics;
                \$statements = (int)\$metrics['statements'];
                \$covered = (int)\$metrics['coveredstatements'];
                if (\$statements > 0) {
                  echo round((\$covered / \$statements) * 100, 2);
                } else {
                  echo '0';
                }
              } else {
                echo '0';
              }
            ")
            echo "Code coverage: ${COVERAGE}%"
            
            # Set minimum threshold (currently 70% based on gap analysis recommendation)
            THRESHOLD=70
            
            # Compare coverage to threshold (using awk for portability)
            # Note: Currently in warning-only mode. To enforce threshold and fail builds:
            # 1. Remove the 'true ||' prefix on the 'exit 1' line below
            # 2. Commit and test to ensure legitimate failures are acceptable
            if awk "BEGIN {exit !($COVERAGE < $THRESHOLD)}"; then
              echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
              echo "::warning::Code coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
              # Currently warning only - remove 'true ||' to enforce
              true || exit 1
            else
              echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
            fi
          else
            echo "⚠️ No coverage.xml file found"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: phpunit
          name: phpunit-coverage
        continue-on-error: true

      - name: Build production autoloader
        run: composer install --no-dev --prefer-dist --classmap-authoritative --no-interaction

  # ────────────────────────────────────────────────────────────────
  # Base+Pro regression matrix.
  #
  # Boots the monolith suite with WP_MCP_AI_BASE_VERSION=true (base
  # entry-point shape) while the Pro addon stays loaded — mirroring the
  # real base+pro deployment. Runs only tests/basepro/ via
  # phpunit-basepro.xml.dist, which pins the load-gate and tool
  # availability contracts added by the base+pro gating fixes.
  # ────────────────────────────────────────────────────────────────
  base-pro:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_DB_NAME: wordpress_test
      WP_DB_USER: wordpress
      WP_DB_PASSWORD: wordpress
      WP_DB_HOST: 127.0.0.1
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DIR: /tmp/wordpress-tests-lib

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mbstring, mysqli
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Configure Composer GitHub token
        run: composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Pro addon dependencies
        working-directory: addons/pro
        run: composer install --no-dev --no-interaction --prefer-dist --ignore-platform-req=ext-fileinfo --ignore-platform-req=ext-gd --ignore-platform-req=ext-zip

      - name: Configure WordPress test suite
        run: |
          bin/install-wp-tests.sh "$WP_DB_NAME" "$WP_DB_USER" "$WP_DB_PASSWORD" "$WP_DB_HOST" latest

      - name: Install optional test plugins
        run: |
          chmod +x bin/install-test-plugins.sh
          bash bin/install-test-plugins.sh || echo "Some test plugins could not be installed"
        continue-on-error: true

      - name: Run base+pro regression suite
        run: vendor/bin/phpunit -c phpunit-basepro.xml.dist --no-coverage

  # ────────────────────────────────────────────────────────────────
  # ────────────────────────────────────────────────
  # Database toolkit gates (Proposal 167).
  #
  # Gates 6 (L2 removal) and 7 (hostile corpus against a live engine)
  # need a real PostgreSQL with a genuinely unprivileged role. The
  # fixture SQL creates `nvoos_reader` (SELECT only, NOBYPASSRLS) and
  # `nvoos_writer` (DML), so the suite proves the guarantee the design
  # rests on: with admission bypassed, a write still fails at the role.
  #
  # Blocking. The job body was reproduced on Linux (php:8.3-cli +
  # pdo_pgsql, postgres:18-alpine) before this flag came off:
  # portable 56/120, parity 77/112, postgres 34/132.
  # ────────────────────────────────────────────────
  database-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nvoos_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nvoos_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NVOOS_TEST_PGSQL_DSN: 'pgsql:host=127.0.0.1;port=55432;dbname=nvoos_test'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo_pgsql, pdo_sqlite
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run cross-host parity suite
        run: vendor/bin/phpunit -c tests/database/parity/phpunit.xml.dist --no-coverage

      - name: Run portable database suite
        run: vendor/bin/phpunit -c tests/database/portable/phpunit.xml.dist --no-coverage

      - name: Run PostgreSQL database suite
        run: vendor/bin/phpunit -c tests/database/postgres/phpunit.xml.dist --no-coverage

  # ────────────────────────────────────────────────────────────────
  # Laravel adapter suite (Proposal 167 phase P4).
  #
  # The kernel, the portable tools and the engine profiles are covered
  # by the three suites above. This job covers the adapter's own surface:
  # the provider wiring (including the readiness gate that proves every
  # `db_*` row is buildable), the audit migration against the package's
  # own schema, the ledger round trip, and the file store's visibility
  # contract.
  #
  # In-memory SQLite and no services: the suite is deterministic and
  # self-contained, which is why it starts blocking. `composer update`
  # rather than `install` because `lib/*/composer.lock` is deliberately
  # untracked in this repository.
  # ────────────────────────────────────────────────
  laravel-adapter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, fileinfo, pdo_sqlite
          tools: composer

      - name: Install adapter dependencies
        working-directory: lib/laravel-adapter
        run: composer update --no-interaction --prefer-dist

      - name: Run the adapter suite
        working-directory: lib/laravel-adapter
        run: php vendor/bin/phpunit --no-coverage
