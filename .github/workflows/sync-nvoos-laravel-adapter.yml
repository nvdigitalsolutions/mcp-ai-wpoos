name: Sync nvoos-laravel-adapter

on:
  push:
    branches: [main, alpha-working]
    paths:
      - 'lib/laravel-adapter/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split subtree
        run: |
          git subtree split --prefix=lib/laravel-adapter --branch=nvoos-laravel-adapter-split

      - name: Push to nvoos-laravel-adapter
        run: |
          git push https://x-access-token:${{ secrets.NVOOS_LARAVEL_ADAPTER_REPO_TOKEN }}@github.com/nvdigitalsolutions/nvoos-laravel-adapter.git nvoos-laravel-adapter-split:main --force
