# Build NV oOS Content Graph Standalone Plugin
#
# Produces a distribution ZIP of the standalone nvoos-content-graph plugin
# (plugins/nvoos-content-graph/). This is the WordPress plugin that ships with
# PSR-4 autoloading and Composer — a completely independent plugin from the
# legacy Graphify addon living under addons/graphify/.
#
# This workflow is intentionally separate from rebuild-all-zips.sh and
# build-addon-zips.sh, which build the addon version from addons/graphify/.
#
# Outputs:
#   nvoos-content-graph-v{version}.zip
#
# Triggered by:
#   - Manual workflow_dispatch with optional version input
#   - Push to a tag matching "content-graph-v*.*.*"
#   - Push to plugins/nvoos-content-graph/** on main/alpha-working

name: Build NV oOS Content Graph Plugin

on:
  push:
    tags:
      - 'content-graph-v*.*.*'
    branches:
      - main
      - alpha-working
    paths:
      - 'plugins/nvoos-content-graph/**'
  pull_request:
    paths:
      - 'plugins/nvoos-content-graph/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Content Graph plugin version (e.g. 1.0.0)'
        required: false
        type: string
      create_release:
        description: 'Create a GitHub Release with the artifact'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Rapid successive merges to alpha-working each trigger this workflow; the
# publish job derives its version from the branch tip, which can advance
# past the triggering commit while the build job runs. Cancel superseded
# runs so only the newest push publishes (the version hand-off via job
# outputs below keeps build/publish consistent regardless).
concurrency:
  group: content-graph-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Build the standalone content-graph plugin ZIP
  # ===========================================================================
  build:
    name: Build Content Graph Plugin
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}

    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules /opt/pipx
          sudo docker image prune -af || true
          sudo docker system prune -af --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "=== After cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Extract version from tag (content-graph-v1.0.0 → 1.0.0)
            VERSION="${GITHUB_REF_NAME#content-graph-v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Read version from plugin header (for branch/PR pushes)
            VERSION=$(grep -E "^\s*\*\s*Version:" plugins/nvoos-content-graph/nvoos-content-graph.php | sed 's/.*Version:\s*//' | tr -d '[:space:]')
            VERSION="${VERSION:-dev}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=nvoos-content-graph-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies (no-dev)
        working-directory: plugins/nvoos-content-graph
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Assemble plugin directory for ZIP
        run: |
          ARTIFACT="${{ steps.version.outputs.artifact }}"
          mkdir -p "dist/${ARTIFACT}/nvoos-content-graph"

          # Copy plugin source (exclude dev/test/build files). Keep in sync with plugins/nvoos-content-graph/.distignore.
          rsync -a \
            --exclude='.git/' \
            --exclude='.gitignore' \
            --exclude='.github/' \
            --exclude='.distignore' \
            --exclude='.wordpress-org/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpunit.xml.dist' \
            --exclude='.phpunit.cache' \
            --exclude='.phpunit.result.cache' \
            --exclude='composer.lock' \
            --exclude='CHANGELOG.md' \
            --exclude='README.md' \
            --exclude='WPORG-REVIEW-*.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='scripts/' \
            --exclude='src/**/README.md' \
            --exclude='vendor.bak-phpunit-conflict/' \
            --exclude='docs/wporg-page-preview.html' \
            --exclude='docs/checkout-enhancement-plan.md' \
            --exclude='.DS_Store' \
            plugins/nvoos-content-graph/ "dist/${ARTIFACT}/nvoos-content-graph/"

          echo "📁 Plugin directory contents:"
          find "dist/${ARTIFACT}/nvoos-content-graph" -type f | sort

      - name: Create ZIP
        run: |
          ARTIFACT="${{ steps.version.outputs.artifact }}"
          cd "dist/${ARTIFACT}"
          zip -r "../../${ARTIFACT}.zip" nvoos-content-graph/
          cd ../..
          SIZE=$(du -sh "${ARTIFACT}.zip" | cut -f1)
          echo "📦 ${ARTIFACT}.zip — ${SIZE}"

      - name: Generate SHA-256 checksum
        run: |
          ARTIFACT="${{ steps.version.outputs.artifact }}"
          sha256sum "${ARTIFACT}.zip" > "${ARTIFACT}.zip.sha256"
          cat "${ARTIFACT}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            ${{ steps.version.outputs.artifact }}.zip
            ${{ steps.version.outputs.artifact }}.zip.sha256
          if-no-files-found: error

  # ===========================================================================
  # WordPress.org Plugin Check gate for the content-graph ZIP.
  #
  # Runs the official Plugin Check (PCP) against the BUILT distribution ZIP
  # (the exact tree that ships to wp.org), not the source checkout. The
  # source tree carries dev files (tests/, phpcs configs, vendor.bak-*,
  # review notes) that PCP flags and that the packaging step intentionally
  # excludes — checking the ZIP is what makes the gate meaningful.
  #
  # Any ERROR-severity finding fails this job (no allowlisted false
  # positives: the 1.0.7 ZIP-shaped tree measured 0 errors; the remaining
  # WARNINGs are the documented PSR-4/DirectDB set that phpcs.xml.dist also
  # exempts).
  # ===========================================================================
  plugin-check:
    name: Plugin Check (content-graph)
    needs: build
    runs-on: ubuntu-latest

    # WordPress cannot boot without a database, and `wp plugin check` (and
    # `wp plugin install`) load WordPress — so the PCP job needs a real
    # MySQL. Same service recipe as the phpunit workflows.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_pluginchk
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_DB_NAME: wordpress_pluginchk
      WP_DB_USER: wordpress
      WP_DB_PASSWORD: wordpress
      WP_DB_HOST: 127.0.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built ZIP
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: artifacts/

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, zip, dom, xml, curl
          tools: composer:v2, wp-cli
          coverage: none

      - name: Bootstrap a temporary WordPress install
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp
          wp core download --version=latest --skip-content --path=/tmp/wp
          wp config create \
            --dbname="${WP_DB_NAME}" \
            --dbuser="${WP_DB_USER}" \
            --dbpass="${WP_DB_PASSWORD}" \
            --dbhost="${WP_DB_HOST}" \
            --path=/tmp/wp
          # Plugin Check runs runtime checks, so WordPress must actually boot.
          # Install a minimal site against the mysql service container.
          wp core install \
            --url="http://127.0.0.1" \
            --title="Plugin Check QA" \
            --admin_user="admin" \
            --admin_password="admin" \
            --admin_email="admin@example.com" \
            --skip-email \
            --path=/tmp/wp

      - name: Install Plugin Check (PCP) plugin
        run: |
          set -euo pipefail
          # Must be ACTIVATED for the wp-cli command to register. (Passing
          # --require=<plugin-check/plugin.php> loads PCP before WordPress
          # boots and fatal-errors with undefined plugin_dir_path().)
          wp plugin install plugin-check --activate --path=/tmp/wp

      - name: Extract built ZIP into wp-content/plugins
        run: |
          set -euo pipefail
          ARTIFACT="${{ needs.build.outputs.artifact }}"
          mkdir -p /tmp/wp/wp-content/plugins
          unzip -q -o "artifacts/${ARTIFACT}.zip" -d /tmp/wp/wp-content/plugins/
          ls /tmp/wp/wp-content/plugins/

      - name: Run wp plugin-check (Errors gate the build)
        run: |
          set -euo pipefail
          cd /tmp/wp
          wp plugin check nvoos-content-graph \
            --path=/tmp/wp \
            --format=json \
            --severity=5 \
            > /tmp/pcp-report.json 2>/tmp/pcp-stderr.log || true

          echo "::group::PCP raw stderr"
          cat /tmp/pcp-stderr.log || true
          echo "::endgroup::"

          # PCP emits one "FILE: <path>" header plus a JSON array per file
          # with findings (chunked stream, not a single array). Strip the
          # headers, then slurp the remaining arrays into one. An empty
          # report (no findings) slurps to zero via jq; an unparseable
          # report fails the step under set -e (fail closed).
          sed -e '/^FILE: /d' /tmp/pcp-report.json > /tmp/pcp-report-parsed.json

          ERRORS=$(jq -s '[.[][] | select(.type=="ERROR")] | length' /tmp/pcp-report-parsed.json)
          WARNINGS=$(jq -s '[.[][] | select(.type=="WARNING")] | length' /tmp/pcp-report-parsed.json)
          echo "Plugin Check ERRORS=${ERRORS}, WARNINGS=${WARNINGS}"
          {
            echo "## WordPress.org Plugin Check (content-graph)"
            echo ""
            echo "- **Errors:** ${ERRORS}"
            echo "- **Warnings:** ${WARNINGS}"
            echo ""
            echo "Full report uploaded as artifact \`pcp-report-content-graph\`."
          } >> $GITHUB_STEP_SUMMARY

          if [ "${ERRORS}" -gt 0 ]; then
            echo "::error::Plugin Check reported ${ERRORS} error(s) — content-graph release is blocked."
            exit 1
          fi

      - name: Upload Plugin Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcp-report-content-graph
          path: |
            /tmp/pcp-report.json
            /tmp/pcp-stderr.log
          if-no-files-found: warn
          retention-days: 30

  # ===========================================================================
  # Publish ZIP to repository build/ directory
  # Only on push to main/alpha-working or tag pushes — not on PRs.
  # ===========================================================================
  publish:
    name: Publish ZIP to Repository
    needs: [build, plugin-check]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha-working' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: artifacts/

      - name: Copy content-graph ZIP to build directory
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          ZIP_SRC="artifacts/nvoos-content-graph-v${VERSION}.zip"

          mkdir -p build

          if [ -f "$ZIP_SRC" ]; then
            cp "$ZIP_SRC" "build/"
            SIZE=$(du -h "build/nvoos-content-graph-v${VERSION}.zip" | cut -f1)
            echo "✅ build/nvoos-content-graph-v${VERSION}.zip — ${SIZE}"
            if [ -f "${ZIP_SRC}.sha256" ]; then
              cp "${ZIP_SRC}.sha256" "build/"
              echo "✅ build/nvoos-content-graph-v${VERSION}.zip.sha256"
            else
              echo "⚠️ ${ZIP_SRC}.sha256 not found in artifact — checksum not updated"
            fi
          else
            echo "❌ $ZIP_SRC not found"
            exit 1
          fi

      - name: Commit and push content-graph ZIP
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          ZIP="build/nvoos-content-graph-v${VERSION}.zip"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          [ -f "$ZIP" ] && git add -f "$ZIP" 2>/dev/null || true
          [ -f "${ZIP}.sha256" ] && git add -f "${ZIP}.sha256" 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "✅ Content Graph plugin ZIP already up-to-date in build/ — nothing to commit"
          else
            echo "📝 Committing content-graph plugin ZIP to build/..."
            git diff --staged --stat

            git commit -m "build: add nvoos-content-graph standalone plugin ZIP v${VERSION} [skip ci]

          - nvoos-content-graph-v${VERSION}.zip
          - nvoos-content-graph-v${VERSION}.zip.sha256

          Auto-generated by GitHub Actions"

            git config core.autocrlf false
            git pull --rebase --autostash origin ${{ github.ref_name }} || {
              echo "⚠️ Rebase conflict detected. Resolving with ours strategy..."
              ZIP="build/nvoos-content-graph-v${VERSION}.zip"
              [ -f "$ZIP" ] && git checkout --ours "$ZIP" && git add -f "$ZIP" || true
              [ -f "${ZIP}.sha256" ] && git checkout --ours "${ZIP}.sha256" && git add -f "${ZIP}.sha256" || true
              git rebase --continue || {
                echo "❌ Failed to resolve rebase conflicts"
                git rebase --abort
                exit 1
              }
            }
            git push origin ${{ github.ref_name }}
            echo "🎉 Content Graph standalone plugin ZIP published to build/"
          fi

  # ===========================================================================
  # Create a GitHub Release (optional, triggered by tag or workflow_dispatch)
  # ===========================================================================
  release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    if: |
      inputs.create_release == true || startsWith(github.ref, 'refs/tags/content-graph-v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: content-graph-v${{ needs.build.outputs.version }}
          name: "NV oOS Content Graph v${{ needs.build.outputs.version }}"
          body: |
            ## NV oOS Content Graph v${{ needs.build.outputs.version }}

            Visual knowledge graph for WordPress. Maps your content into an interactive, navigable graph. Zero API keys required.

            ### Requirements

            - WordPress 6.5+
            - PHP 8.1+

            ### Checksum

            See the `.sha256` file attached to this release.
          files: |
            artifacts/*.zip
            artifacts/*.sha256
          draft: false
          prerelease: false
