# NPM Registry Alpha Publishing Workflow
#
# This workflow publishes alpha versions of all NPM packages to the public NPM registry.
#
# Packages published (9 total):
# - @nvdigitalsolutions/nvoos-storage
# - @nvdigitalsolutions/nvoos-markdown
# - @nvdigitalsolutions/nvoos-events
# - @nvdigitalsolutions/nvoos-clipboard
# - @nvdigitalsolutions/nvoos-http-client
# - @nvdigitalsolutions/nvoos-offline-sync
# - @nvdigitalsolutions/nvoos-slash-commands
# - @nvdigitalsolutions/nvoos-audio
# - @nvdigitalsolutions/nvoos-dom-batcher
#
# Trigger: Push tags matching v*.*.*-alpha.*
# Example: v0.1.0-alpha.1, v0.2.0-alpha.2, etc.
#
# Setup Required:
# 1. Create NPM access token at https://www.npmjs.com/settings/<username>/tokens
# 2. Add NPM_TOKEN secret to repository at Settings > Secrets and variables > Actions
# 3. Ensure @nvdigitalsolutions organization exists on NPM (or update package names)
#
# Author: NV Digital Solutions (https://nvdigitalsolutions.com/)

name: Publish Alpha to NPM

on:
  push:
    tags:
      - 'v*.*.*-alpha.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Alpha version to publish (e.g., 0.1.0-alpha.1). Leave blank to use version from package.json.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (skip actual publishing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Single source of truth for the package list.
# Add a new package name here and it will be automatically included
# in every step: version bump, build, verify, dry-run summary, and publish.
env:
  PACKAGES: >-
    nvoos-storage nvoos-markdown nvoos-events nvoos-clipboard
    nvoos-http-client nvoos-offline-sync nvoos-slash-commands
    nvoos-audio nvoos-dom-batcher

jobs:
  publish:
    name: Publish Alpha Packages to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Extract version from tag (remove 'v' prefix)
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Read current version from the first package in the list
            FIRST_PKG=$(echo $PACKAGES | awk '{print $1}')
            VERSION=$(node -p "require('./packages/${FIRST_PKG}/package.json').version")
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Publishing version: ${VERSION}"

      - name: Validate alpha version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "❌ Invalid alpha version format: $VERSION"
            echo "Expected format: X.Y.Z-alpha.N (e.g., 0.1.0-alpha.1)"
            exit 1
          fi
          echo "✅ Alpha version format valid: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check NPM authentication
        id: check_auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️ NPM_TOKEN secret not configured. Skipping NPM publishing."
            echo ""
            echo "To enable NPM publishing:"
            echo "1. Create an NPM access token at https://www.npmjs.com/settings/<username>/tokens"
            echo "2. Add NPM_TOKEN to repository secrets at Settings > Secrets and variables > Actions"
            echo "3. Ensure the token has 'Automation' or 'Publish' permissions"
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ NPM authentication token found"
          fi

      - name: Update package versions
        if: steps.check_auth.outputs.has_token == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "📝 Updating package.json files to version ${VERSION}..."

          for pkg in $PACKAGES; do
            cd packages/${pkg}
            npm pkg set version="${VERSION}"
            echo "✅ Updated @nvdigitalsolutions/${pkg} to ${VERSION}"
            cd ../..
          done

      - name: Build all packages
        if: steps.check_auth.outputs.has_token == 'true'
        run: |
          for pkg in $PACKAGES; do
            echo "🔨 Building @nvdigitalsolutions/${pkg}..."
            cd packages/${pkg}
            npm run build
            echo "✅ Build complete"
            ls -lh dist/
            cd ../..
          done

      - name: Verify package contents
        if: steps.check_auth.outputs.has_token == 'true'
        run: |
          echo "📦 Verifying package contents before publishing..."
          for pkg in $PACKAGES; do
            echo ""
            echo "=== @nvdigitalsolutions/${pkg} ==="
            cd packages/${pkg}
            npm pack --dry-run
            cd ../..
          done

      - name: Publish @nvdigitalsolutions/nvoos-storage
        if: steps.check_auth.outputs.has_token == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/nvoos-storage
          npm publish --tag alpha --access public
          echo "✅ Published @nvdigitalsolutions/nvoos-storage@${{ steps.version.outputs.version }}"

      - name: Publish @nvdigitalsolutions/nvoos-markdown
        if: steps.check_auth.outputs.has_token == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/nvoos-markdown
          npm publish --tag alpha --access public
          echo "✅ Published @nvdigitalsolutions/nvoos-markdown@${{ steps.version.outputs.version }}"

      - name: Publish @nvdigitalsolutions/nvoos-events
        if: steps.check_auth.outputs.has_token == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/nvoos-events
          npm publish --tag alpha --access public
          echo "✅ Published @nvdigitalsolutions/nvoos-events@${{ steps.version.outputs.version }}"

      - name: Publish @nvdigitalsolutions/nvoos-clipboard
        if: steps.check_auth.outputs.has_token == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/nvoos-clipboard
          npm publish --tag alpha --access public
          echo "✅ Published @nvdigitalsolutions/nvoos-clipboard@${{ steps.version.outputs.version }}"

      - name: Publish @nvdigitalsolutions/nvoos-http-client
        if: steps.check_auth.outputs.has_token == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/nvoos-http-client
          npm publish --tag alpha --access public
          echo "✅ Published @nvdigitalsolutions/nvoos-http-client@${{ steps.version.outputs.version }}"

      - name: Publish @nvdigitalsolutions/nvoos-offline-sync
        if: steps.check_auth.outputs.has_token == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/nvoos-offline-sync
          npm publish --tag alpha --access public
          echo "✅ Published @nvdigitalsolutions/nvoos-offline-sync@${{ steps.version.outputs.version }}"

      - name: Publish @nvdigitalsolutions/nvoos-slash-commands
        if: steps.check_auth.outputs.has_token == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/nvoos-slash-commands
          npm publish --tag alpha --access public
          echo "✅ Published @nvdigitalsolutions/nvoos-slash-commands@${{ steps.version.outputs.version }}"

      - name: Publish @nvdigitalsolutions/nvoos-audio
        if: steps.check_auth.outputs.has_token == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/nvoos-audio
          npm publish --tag alpha --access public
          echo "✅ Published @nvdigitalsolutions/nvoos-audio@${{ steps.version.outputs.version }}"

      - name: Publish @nvdigitalsolutions/nvoos-dom-batcher
        if: steps.check_auth.outputs.has_token == 'true' && github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/nvoos-dom-batcher
          npm publish --tag alpha --access public
          echo "✅ Published @nvdigitalsolutions/nvoos-dom-batcher@${{ steps.version.outputs.version }}"

      - name: Dry run summary
        if: steps.check_auth.outputs.has_token == 'true' && github.event.inputs.dry_run == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "🏃 Dry run complete - no packages were published"
          echo ""
          echo "The following packages would have been published to NPM:"
          for pkg in $PACKAGES; do
            echo "  - @nvdigitalsolutions/${pkg}@${VERSION}"
          done

      - name: Publication summary
        if: steps.check_auth.outputs.has_token == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## 🎉 All 9 alpha packages published successfully to NPM!"
          echo ""
          echo "### Published Packages"
          echo ""
          for pkg in $PACKAGES; do
            echo "✅ **@nvdigitalsolutions/${pkg}@${VERSION}**"
            echo "   Install: \`npm install @nvdigitalsolutions/${pkg}@alpha\`"
            echo "   NPM: https://www.npmjs.com/package/@nvdigitalsolutions/${pkg}"
            echo ""
          done
          echo "### Installing from NPM"
          echo ""
          echo "\`\`\`bash"
          echo "# Install a specific package at the latest alpha tag"
          echo "npm install @nvdigitalsolutions/nvoos-storage@alpha"
          echo "npm install @nvdigitalsolutions/nvoos-slash-commands@alpha"
          echo "npm install @nvdigitalsolutions/nvoos-audio@alpha"
          echo "npm install @nvdigitalsolutions/nvoos-dom-batcher@alpha"
          echo "\`\`\`"
          echo ""
          echo "### Documentation"
          echo ""
          echo "- [All Packages](https://github.com/nvdigitalsolutions/mcp-ai-wpoos/tree/main/packages)"
