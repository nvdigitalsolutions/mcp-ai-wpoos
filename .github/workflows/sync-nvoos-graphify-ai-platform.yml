name: Sync nvoos-graphify-ai-platform

on:
  push:
    branches: [main, alpha-working]
    paths:
      - 'plugins/nvoos-graphify-ai-platform/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split subtree
        run: |
          git subtree split --prefix=plugins/nvoos-graphify-ai-platform --branch=nvoos-graphify-ai-platform-split

      - name: Push to nvoos-graphify-ai-platform
        run: |
          git config --local --unset-all http.https://github.com/.extraheader
          git push https://x-access-token:${{ secrets.NVOOS_GRAPHIFY_AI_PLATFORM_REPO_TOKEN }}@github.com/nvdigitalsolutions/nvoos-graphify-ai-platform.git nvoos-graphify-ai-platform-split:main --force
