name: Tool Readiness

# Proposal 090-M. Registration is derived from `lib/core/resources/tool-readiness.php`,
# so the manifest is a policy file and needs a gate:
#
#   G1  every tool-contract class in lib/core has a manifest row
#   G2  every row names a real class, a known readiness value and the same slug
#       the class declares
#   O3  a servable core tool that shares a slug with a WordPress tool must carry
#       a `parity` claim (a deliberate port) rather than shadowing silently
#
# The second job guards the capability-flag catalogue, which is extracted
# statically from the WordPress corpus and checked in as data:
#
#   G4  the catalogue is byte-identical to what `bin/generate-tool-capability-flags.php`
#       would emit today
#
# A third job guards the profession snapshot, which is generated from the
# WordPress reference data and checked in as data:
#
#   G5  the snapshot is byte-identical to what `bin/sync-professions.php`
#       would emit today (the six `pro-*` packs excluded by design)
#
# G4 is a **hard gate**. A tool whose flags change without the catalogue being
# regenerated would silently move the necessity gate's verdict — the catalogue is
# the gate's only vocabulary for a core tool that declares none of its own.
#
# The tree is green as of 090-M Phase 2 (61 servable, 19 quarantined, 0 violations).
# This job is REPORT-ONLY while the gate soaks: `continue-on-error` keeps it from
# blocking merges, while the JSON report is uploaded for review. Promote it to a
# hard gate by removing `continue-on-error` — no other change is needed.

on:
  push:
    branches: [ main, alpha-working ]
  pull_request:

permissions:
  contents: read

jobs:
  readiness:
    name: Tool readiness manifest
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Audit the manifest
        run: php bin/audit-tool-readiness.php --json > tool-readiness.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-readiness
          path: tool-readiness.json
          if-no-files-found: ignore
          retention-days: 14

  capability-flags:
    name: Capability-flag catalogue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # Static extraction (`token_get_all`), no WordPress bootstrap needed.
      # Fails when a tool's declared flags have moved without the checked-in
      # catalogue being regenerated.
      - name: Check the catalogue is in step with the corpus
        run: php bin/generate-tool-capability-flags.php --check

  professions:
    name: Profession catalogue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # The app serves a generated snapshot of the WordPress base catalogue.
      # Fails when a profession document or the generator moves without the
      # snapshot being regenerated, so the console cannot silently shrink back
      # to the package's nine-profession starter.
      - name: Check the snapshot is in step with the reference data
        run: php bin/sync-professions.php --check
