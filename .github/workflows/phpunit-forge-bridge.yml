# PHPUnit + phpcs for the standalone NV oOS Forge Bridge plugin
# (plugins/nvoos-forge-bridge — own composer.json, own PHPUnit 9.6 config,
# wp-phpunit from its own vendor). Mirrors phpunit-content-graph.yml: the
# plugin's test suite pairs with a downloaded WordPress core; no root-vendor
# dependency. The WP-CLI fallback step guards the setup-php flake.

name: PHPUnit Forge Bridge

on:
  push:
    branches:
      - main
      - alpha-working
    paths:
      - 'plugins/nvoos-forge-bridge/**'
      - '.github/workflows/phpunit-forge-bridge.yml'
  pull_request:
    paths:
      - 'plugins/nvoos-forge-bridge/**'
      - '.github/workflows/phpunit-forge-bridge.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DIR: ${{ github.workspace }}/plugins/nvoos-forge-bridge/vendor/wp-phpunit/wp-phpunit

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli
          tools: composer:v2, wp-cli

      - name: Ensure WP-CLI is available
        # setup-php's `tools: wp-cli` fails intermittently without failing
        # the step (see the content-graph precedent).
        run: |
          if ! command -v wp >/dev/null 2>&1; then
            curl -sSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
            chmod +x wp-cli.phar
            sudo mv wp-cli.phar /usr/local/bin/wp
          fi
          wp --version

      - name: Install plugin Composer dependencies
        working-directory: plugins/nvoos-forge-bridge
        run: composer install --no-interaction --prefer-dist

      - name: PHP CodeSniffer (own standard)
        working-directory: plugins/nvoos-forge-bridge
        run: vendor/bin/phpcs --standard=phpcs.xml.dist .

      - name: Download WordPress core
        run: |
          wp core download --version=latest --skip-content --path="${WP_CORE_DIR}"

      - name: Configure WordPress test suite
        run: |
          cat > "${WP_TESTS_DIR}/wp-tests-config.php" <<'PHP'
          <?php
          define( 'ABSPATH', '/tmp/wordpress/' );
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'wordpress' );
          define( 'DB_PASSWORD', 'wordpress' );
          define( 'DB_HOST', '127.0.0.1' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );
          define( 'WP_TESTS_DOMAIN', 'example.org' );
          define( 'WP_TESTS_EMAIL', 'admin@example.org' );
          define( 'WP_TESTS_TITLE', 'Test Blog' );
          define( 'WP_PHP_BINARY', 'php' );
          $table_prefix = 'wptests_';
          PHP

      - name: Run PHPUnit
        working-directory: plugins/nvoos-forge-bridge
        run: |
          vendor/bin/phpunit -c phpunit.xml.dist --no-coverage

  # ===========================================================================
  # WordPress.org Plugin Check (PCP) gate — ERRORs block the PR.
  # Mirrors the content-graph job in build-nvoos-content-graph.yml: WordPress
  # cannot boot without a database, `wp plugin check` needs the plugin-check
  # plugin ACTIVATED (--require loads PCP before WP boots and fatal-errors),
  # and the report is a chunked stream (FILE: headers + one JSON array per
  # file), not a single JSON document.
  # ===========================================================================
  plugin-check:
    name: Plugin Check (forge-bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_pluginchk
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_DB_NAME: wordpress_pluginchk
      WP_DB_USER: wordpress
      WP_DB_PASSWORD: wordpress
      WP_DB_HOST: 127.0.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, zip, dom, xml, curl
          tools: composer:v2, wp-cli

      - name: Ensure WP-CLI is available
        # setup-php's `tools: wp-cli` fails intermittently without failing
        # the step (see the content-graph precedent).
        run: |
          if ! command -v wp >/dev/null 2>&1; then
            curl -sSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
            chmod +x wp-cli.phar
            sudo mv wp-cli.phar /usr/local/bin/wp
          fi
          wp --version

      - name: Stage the plugin tree (distignore shape)
        # No ZIP build exists for forge-bridge yet, so the check runs against
        # a tar-staged copy of the shipping shape. The exclude list MUST stay
        # in sync with plugins/nvoos-forge-bridge/.distignore.
        run: |
          mkdir -p /tmp/plugin-src/nvoos-forge-bridge
          tar -C plugins/nvoos-forge-bridge -cf - \
            --exclude='./vendor' \
            --exclude='./tests' \
            --exclude='./composer.json' \
            --exclude='./composer.lock' \
            --exclude='./phpcs.xml.dist' \
            --exclude='./phpunit.xml.dist' \
            --exclude='./.phpunit.cache' \
            --exclude='./.phpunit.result.cache' \
            --exclude='./README.md' \
            --exclude='./.wordpress-org' \
            --exclude='./.gitignore' \
            --exclude='./.distignore' \
            . | tar -C /tmp/plugin-src/nvoos-forge-bridge -xf -
          ls -la /tmp/plugin-src/nvoos-forge-bridge/

      - name: Bootstrap a temporary WordPress install
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp
          wp core download --version=latest --skip-content --path=/tmp/wp
          wp config create \
            --dbname="${WP_DB_NAME}" \
            --dbuser="${WP_DB_USER}" \
            --dbpass="${WP_DB_PASSWORD}" \
            --dbhost="${WP_DB_HOST}" \
            --path=/tmp/wp
          wp core install \
            --url="http://127.0.0.1" \
            --title="Plugin Check QA" \
            --admin_user="admin" \
            --admin_password="admin" \
            --admin_email="admin@example.com" \
            --skip-email \
            --path=/tmp/wp

      - name: Install Plugin Check (PCP) plugin
        run: |
          set -euo pipefail
          # Must be ACTIVATED for the wp-cli command to register.
          wp plugin install plugin-check --activate --path=/tmp/wp

      - name: Copy the staged plugin into wp-content/plugins
        run: |
          set -euo pipefail
          cp -r /tmp/plugin-src/nvoos-forge-bridge /tmp/wp/wp-content/plugins/
          ls /tmp/wp/wp-content/plugins/

      - name: Run wp plugin-check (Errors gate the build)
        run: |
          set -euo pipefail
          cd /tmp/wp
          wp plugin check nvoos-forge-bridge \
            --path=/tmp/wp \
            --format=json \
            --severity=5 \
            > /tmp/pcp-report.json 2>/tmp/pcp-stderr.log || true

          echo "::group::PCP raw stderr"
          cat /tmp/pcp-stderr.log || true
          echo "::endgroup::"

          # PCP emits one "FILE: <path>" header plus a JSON array per file
          # with findings (chunked stream, not a single array). On a run with
          # ZERO findings the report contains only a "Success: ..." status
          # line instead of JSON — keep only lines that start with "[" so
          # jq slurps either shape (a clean run slurps to zero).
          grep '^\[' /tmp/pcp-report.json > /tmp/pcp-report-parsed.json || true

          ERRORS=$(jq -s '[.[][] | select(.type=="ERROR")] | length' /tmp/pcp-report-parsed.json)
          WARNINGS=$(jq -s '[.[][] | select(.type=="WARNING")] | length' /tmp/pcp-report-parsed.json)
          echo "Plugin Check ERRORS=${ERRORS}, WARNINGS=${WARNINGS}"
          {
            echo "## WordPress.org Plugin Check (forge-bridge)"
            echo ""
            echo "- **Errors:** ${ERRORS}"
            echo "- **Warnings:** ${WARNINGS}"
            echo ""
            echo "Full report uploaded as artifact \`pcp-report-forge-bridge\`."
          } >> $GITHUB_STEP_SUMMARY

          if [ "${ERRORS}" -gt 0 ]; then
            echo "::error::Plugin Check reported ${ERRORS} error(s) — forge-bridge release is blocked."
            exit 1
          fi

      - name: Upload Plugin Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcp-report-forge-bridge
          path: |
            /tmp/pcp-report.json
            /tmp/pcp-stderr.log
          if-no-files-found: warn
          retention-days: 30
