name: Docs Contract

# Proposal 166 (Unix Theory P8–P12): every first-party source file carries the
# licence of its nearest manifest and a purpose header sized to its class.
#
#   .github/docs-scopes.json   scope -> globs -> manifest authority
#   .github/docs-budget.json   the ratchet baseline
#   bin/check-file-docs.php    the checker
#
# See docs/developer/file-header-convention.md.

on:
  push:
    branches: [ main, alpha-working ]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Documentation contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The pack is ~39 GB for 2,136 commits, so a full-history checkout
          # never finishes on a hosted runner. Depth 1 plus the explicit
          # depth-1 base fetch below is enough: the checker falls back to a
          # two-dot tree diff when the repository is shallow.
          fetch-depth: 1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Inserter self-test
        run: php bin/check-file-docs.php --self-test

      - name: Scope audit
        run: php bin/check-file-docs.php --audit-scopes

      - name: Full contract (ratchet)
        run: php bin/check-file-docs.php --strict

      # A PR stacked on a branch that was squash-merged and then deleted keeps
      # reporting that dead branch in `github.base_ref`. Fetching it fails with
      # "couldn't find remote ref", which leaves every re-run of the already
      # merged PR permanently red. The delta check is an early warning, not the
      # authority - the full ratchet check above still covers this tree - so a
      # genuinely absent base skips only the delta. Any other fetch failure
      # (network, permissions) still fails the job.
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          refspec='refs/heads/'"${BASE_REF}"':refs/remotes/origin/'"${BASE_REF}"
          if out=$(git fetch --no-tags --depth=1 origin "$refspec" 2>&1); then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q "couldn't find remote ref"; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Base ref unavailable::origin/${BASE_REF} no longer exists, usually because the stacked base was squash-merged and deleted. Skipping the new-files delta check."
          else
            printf '%s\n' "$out"
            exit 1
          fi

      - name: New files must be clean
        if: github.event_name == 'pull_request' && steps.base.outputs.present == 'true'
        run: php bin/check-file-docs.php --new-files-only --strict --base=origin/${{ github.base_ref }}

      - name: Licence boundary
        run: bash bin/check-license-boundary.sh

      - name: Folder READMEs
        run: php bin/check-file-docs.php --folder-docs

      - name: Folder READMEs (PHP)
        run: php bin/check-folder-readmes.php --scope=all --strict
