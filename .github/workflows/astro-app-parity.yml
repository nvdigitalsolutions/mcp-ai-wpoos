name: Astro app parity

# The two Astro products share a CONTRACT but not code: `examples/nvoos-astro-forge`
# GENERATES sites and `examples/nvoos-astro-velocity` is a hand-built storefront.
# Both compose the agent-facing `llms.txt`, both declare a `data-section`
# vocabulary, both ship the same `mail.ts` form transport, and both expose an
# MCP server with the same annotation presets + fail-closed request pipeline,
# so those surfaces must not drift — and neither app's own suite can see the
# other tree, so drift is invisible without this gate. MCP tool LISTS differ on
# purpose (a generator vs a storefront); only the shared runtime and any tool
# name that appears on both sides are gated.
#
# The `paths` filters must cover EVERY file the script reads, in BOTH trees.
# Narrow filters are how a drift gate silently stops running: editing only
# velocity's `src/lib/mail.ts` (or its form endpoint) has to trigger it, not just
# edits under the forge.
#
# Same discipline as `bin/check-chat-parity.php` (legacy chat ↔ lib/core) and the
# base+pro → CG-Pro port verifier: compare implementations directly, and make
# every difference DELIBERATE and written down in the script.
#
# Deliberately NOT a vitest test inside either app: it would join that app's
# suite, so every CI run of that app would need the OTHER app's node_modules
# (each tsconfig extends `astro/tsconfigs/strict`, resolved from the importing
# file's directory → `[TSCONFIG_ERROR] Tsconfig not found`). Node 24 strips TS
# types natively, so a plain script imports both trees with one install.

on:
  push:
    branches: [main, alpha-working]
    paths:
      - 'bin/check-astro-app-parity.mjs'
      - 'examples/nvoos-astro-forge/lib/**'
      - 'examples/nvoos-astro-forge/mcp/**'
      - 'examples/nvoos-astro-velocity/src/lib/**'
      - 'examples/nvoos-astro-velocity/src/pages/forms/**'
      - 'examples/nvoos-astro-velocity/mcp/**'
      - '.github/workflows/astro-app-parity.yml'
  pull_request:
    paths:
      - 'bin/check-astro-app-parity.mjs'
      - 'examples/nvoos-astro-forge/lib/**'
      - 'examples/nvoos-astro-forge/mcp/**'
      - 'examples/nvoos-astro-velocity/src/lib/**'
      - 'examples/nvoos-astro-velocity/src/pages/forms/**'
      - 'examples/nvoos-astro-velocity/mcp/**'
      - '.github/workflows/astro-app-parity.yml'

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 strips TS types without a flag (the forge CLI already relies
          # on native type stripping; Astro 7 needs >= 22.23.4 anyway).
          node-version: 24
          cache: npm
          cache-dependency-path: examples/nvoos-astro-forge/package-lock.json

      # Only the forge needs installing: its llms module imports htmlparser2.
      # The velocity modules this check imports are dependency-free on purpose —
      # keep them that way, or this step gains a second `npm ci`.
      - name: Install (forge)
        working-directory: examples/nvoos-astro-forge
        run: npm ci --no-audit --no-fund

      - name: Cross-app contract parity
        run: node bin/check-astro-app-parity.mjs
