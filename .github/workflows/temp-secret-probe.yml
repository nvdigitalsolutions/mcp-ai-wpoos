name: Secret Probe (temp)

on:
  push:
    branches: [alpha-working]
    paths:
      - '.github/workflows/temp-secret-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe platform repo token
        env:
          TOKEN_CGP: ${{ secrets.NVOOS_CONTENT_GRAPH_AI_PLATFORM_REPO_TOKEN }}
        run: |
          echo "TOKEN_CGP_LENGTH=${#TOKEN_CGP}"
          echo "TOKEN_CGP_USER_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${TOKEN_CGP}" https://api.github.com/user)"
          echo "TOKEN_CGP_LOGIN=$(curl -s -H "Authorization: Bearer ${TOKEN_CGP}" https://api.github.com/user | jq -r '.login')"
          echo "TOKEN_CGP_REPO=$(curl -s -H "Authorization: Bearer ${TOKEN_CGP}" https://api.github.com/repos/nvdigitalsolutions/nvoos-content-graph-ai-platform | jq -r '"push=\(.permissions.push // "none") message=\(.message // "ok")"')"
