name: JavaScript Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        # Node 18 reached EOL on 2025-04-30 and cannot require() an ES module,
        # which @wordpress/eslint-plugin@25 does inside
        # rules/no-unknown-ds-tokens.js (ERR_REQUIRE_ESM). require(esm) is
        # available unflagged from Node 20.19 / 22.12, so 20.x (latest) works
        # and 18.x cannot. Every other workflow in this repo is on 20, 22 or
        # 24; this was the last 18.
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-engines

      - name: Run JavaScript linter
        run: npm run lint:js

      - name: Run Jest tests
        run: npm test

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20.x'
        with:
          files: ./coverage/lcov.info
          flags: javascript
          name: javascript-coverage
        continue-on-error: true
