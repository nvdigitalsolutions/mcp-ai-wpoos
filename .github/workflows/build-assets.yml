# Build Plugin Assets & Distributions
#
# WordPress Plugin Standard Build Process
#
# For WordPress plugins, built files (minified CSS/JS, vendor libs, ZIPs) 
# are COMMITTED to the repository because:
# 1. WordPress.org SVN requires production-ready code
# 2. Users install directly without build steps
# 3. Plugin must work immediately after activation
#
# This follows WordPress Plugin Handbook best practices:
# https://developer.wordpress.org/plugins/wordpress-org/how-to-use-subversion/
#
# Author: NV Digital Solutions (https://nvdigitalsolutions.com/)

name: Build Assets & Distributions

on:
  push:
    branches:
      - main
      - develop
      - alpha-working
      - 'release/**'
      - 'hotfix/**'
      - 'copilot/**'
    paths:
      # Rebuild when source files change
      - 'assets/js/**/*.js'
      - 'assets/css/**/*.css'
      - '!assets/**/*.min.js'
      - '!assets/**/*.min.css'
      - 'includes/**/*.php'
      - 'addons/**/*.php'
      - '*.php'
      - 'composer.json'
      - 'package.json'
      - 'bin/build-plugin-zip.sh'
      - 'bin/build-addon-zips.sh'
      - 'bin/build-wordpress-org-from-base.sh'
      - 'bin/build-optional-components.sh'
      - 'bin/rebuild-all-zips.sh'
      - 'bin/review-zips.sh'
      - 'src/tma-template-builder/**'
      - 'src/tma-woo-shop/**'
      - 'src/tma-shopify-jewelry/**'
      - 'webpack.config.tma.js'
      - 'src/workflow-builder/**'
      - 'webpack.config.workflow.js'
      # Knowledge base files (profession playbooks & data)
      - 'includes/knowledge-base/**'
  pull_request:
    branches:
      - main
      - develop
      - alpha-working
    paths:
      - 'assets/js/**/*.js'
      - 'assets/css/**/*.css'
      - 'includes/**/*.php'
      - 'addons/**/*.php'
      - '*.php'
      - 'composer.json'
      - 'package.json'
      - 'bin/build-plugin-zip.sh'
      - 'bin/build-addon-zips.sh'
      - 'bin/build-wordpress-org-from-base.sh'
      - 'bin/build-optional-components.sh'
      - 'bin/rebuild-all-zips.sh'
      - 'bin/review-zips.sh'
      - 'src/tma-template-builder/**'
      - 'src/tma-woo-shop/**'
      - 'src/tma-shopify-jewelry/**'
      - 'webpack.config.tma.js'
      - 'src/workflow-builder/**'
      - 'webpack.config.workflow.js'
      # Knowledge base files (profession playbooks & data)
      - 'includes/knowledge-base/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PLUGIN_SLUG: wp-mcp-ai

jobs:
  # =============================================================================
  # Build Everything (WordPress Standard)
  # =============================================================================
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    
    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules /opt/pipx
          sudo docker image prune -af || true
          sudo docker system prune -af --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "=== After cleanup ==="
          df -h

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, zip
          tools: composer:v2

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci
          echo "✅ Node dependencies installed"

      - name: Build plugin distributions
        run: |
          echo "🔨 Building all 8 plugin ZIP files..."
          chmod +x bin/rebuild-all-zips.sh
          ./bin/rebuild-all-zips.sh
          
          echo ""
          echo "📦 All plugin distributions:"
          ls -lh build/*.zip
          if [ -d "build/toolkit-addons" ] && [ -n "$(ls -A build/toolkit-addons/*.zip 2>/dev/null)" ]; then
            echo ""
            echo "📦 Toolkit add-ons:"
            ls -lh build/toolkit-addons/*.zip
          fi

      - name: Build knowledge-base optional component
        run: |
          echo "📚 Building knowledge-base ZIP from current playbook files..."
          VERSION=$(grep -E "^\s*\*\s*Version:" mcp-ai-wpoos.php | sed 's/.*Version:\s*//' | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            VERSION="dev"
          fi
          echo "   Version: $VERSION"
          chmod +x bin/build-optional-components.sh
          ./bin/build-optional-components.sh "$VERSION"
          echo ""
          echo "📦 Optional component ZIPs:"
          ls -lh build/optional-components/*.zip 2>/dev/null || echo "   (none)"

      - name: Check for changes
        id: check_changes
        run: |
          # Ensure build/ directory exists (it may not if .gitkeep was just restored
          # or if the directory was deleted from the repo).
          mkdir -p build

          # Add all built files
          git add -f assets/**/*.min.css assets/**/*.min.css.map 2>/dev/null || true
          git add -f assets/**/*.min.js assets/**/*.min.js.map 2>/dev/null || true
          git add -f build/*.zip 2>/dev/null || true
          # Also commit individual toolkit add-on ZIPs (e.g. oos-toolkit-tcpdf, oos-toolkit-document-generation, …)
          # so they appear alongside the other distributions in build/.
          if [ -d "build/toolkit-addons" ] && [ -n "$(ls -A build/toolkit-addons/*.zip 2>/dev/null)" ]; then
            git add -f build/toolkit-addons/*.zip 2>/dev/null || true
          fi
          git add -f addons/pro/build/tma-template-builder/ 2>/dev/null || true
          git add -f addons/pro/build/tma-woo-shop/ 2>/dev/null || true
          git add -f addons/pro/build/tma-shopify-jewelry/ 2>/dev/null || true
          git add -f addons/pro/build/workflow-builder/ 2>/dev/null || true
          # Also commit optional component ZIPs (knowledge-base, vectorizer)
          if [ -d "build/optional-components" ] && [ -n "$(ls -A build/optional-components/*.zip 2>/dev/null)" ]; then
            git add -f build/optional-components/*.zip 2>/dev/null || true
          fi
          
          # Check if anything changed
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ No changes to built files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Built files have been updated:"
            git diff --staged --stat
          fi

      - name: Commit built files (WordPress standard)
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.check_changes.outputs.changed == 'true' &&
          !contains(github.event.head_commit.message, '[skip ci]') &&
          !contains(github.event.head_commit.message, '[skip build]')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Commit with descriptive message
          git commit -m "build: update compiled assets and distributions [skip ci]

          - Rebuilt minified CSS/JS from source files
          - Regenerated plugin distribution ZIPs
          - Ready for WordPress.org deployment
          
          Auto-generated by GitHub Actions"
          
          # Disable CRLF normalization so that vendor files with CRLF line endings
          # (addons/pro/assets/vendor/**) do not appear as unstaged changes on Linux CI.
          # Without this, git stash saves the changes but restores the same CRLF files,
          # which immediately re-appear as modified and block git pull --rebase.
          git config core.autocrlf false
          
          # Discard any CRLF-only unstaged changes in tracked files so the rebase is clean
          git checkout -- . 2>/dev/null || true
          
          # Pull and rebase to handle any new commits pushed while building.
          # --autostash handles any remaining unstaged changes automatically.
          git pull --rebase --autostash origin ${{ github.ref_name }} || {
            echo "⚠️ Rebase conflict detected. Attempting to resolve..."
            # For build artifacts, we can safely use ours strategy
            mkdir -p build
            git checkout --ours build/*.zip 2>/dev/null || true
            git add -f build/*.zip 2>/dev/null || true
            if [ -d "build/toolkit-addons" ] && [ -n "$(ls -A build/toolkit-addons/*.zip 2>/dev/null)" ]; then
              git checkout --ours build/toolkit-addons/*.zip 2>/dev/null || true
              git add -f build/toolkit-addons/*.zip 2>/dev/null || true
            fi
            if [ -d "build/optional-components" ] && [ -n "$(ls -A build/optional-components/*.zip 2>/dev/null)" ]; then
              git checkout --ours build/optional-components/*.zip 2>/dev/null || true
              git add -f build/optional-components/*.zip 2>/dev/null || true
            fi
            git rebase --continue || {
              echo "❌ Failed to resolve rebase conflicts"
              git rebase --abort
              exit 1
            }
          }
          
          git push

      - name: Upload artifacts for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build-pr-${{ github.event.pull_request.number }}
          path: |
            build/*.zip
            build/toolkit-addons/*.zip
            build/optional-components/*.zip
            assets/**/*.min.css
            assets/**/*.min.js
          retention-days: 7

      - name: Comment on PR with build results
        if: github.event_name == 'pull_request' && steps.check_changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            // Get list of changed files
            const changedFiles = execSync('git diff --staged --name-only').toString().trim().split('\n');
            const assets = changedFiles.filter(f => f.includes('.min.'));
            const zips = changedFiles.filter(f => f.endsWith('.zip'));
            
            let comment = `## 📦 Build Results\n\n`;
            comment += `The plugin has been rebuilt with your changes.\n\n`;
            
            if (assets.length > 0) {
              comment += `### 🎨 Updated Assets (${assets.length} files)\n\n`;
              comment += assets.slice(0, 10).map(f => `- \`${f}\``).join('\n');
              if (assets.length > 10) comment += `\n- ...and ${assets.length - 10} more`;
              comment += `\n\n`;
            }
            
            if (zips.length > 0) {
              comment += `### 📦 Plugin Distributions\n\n`;
              const zipFiles = fs.readdirSync('build').filter(f => f.endsWith('.zip'));
              for (const zip of zipFiles) {
                const stats = fs.statSync(`build/${zip}`);
                const sizeMB = (stats.size / 1024 / 1024).toFixed(2);
                comment += `- \`${zip}\` (${sizeMB} MB)\n`;
              }
              comment += `\n`;

              // List individual toolkit add-on ZIPs (build/toolkit-addons/*.zip).
              if (fs.existsSync('build/toolkit-addons')) {
                const toolkitZips = fs.readdirSync('build/toolkit-addons').filter(f => f.endsWith('.zip'));
                if (toolkitZips.length > 0) {
                  comment += `### 🧰 Toolkit Add-ons (${toolkitZips.length})\n\n`;
                  for (const zip of toolkitZips) {
                    const stats = fs.statSync(`build/toolkit-addons/${zip}`);
                    const sizeMB = (stats.size / 1024 / 1024).toFixed(2);
                    comment += `- \`build/toolkit-addons/${zip}\` (${sizeMB} MB)\n`;
                  }
                  comment += `\n`;
                }
              }

              // List optional component ZIPs (build/optional-components/*.zip).
              if (fs.existsSync('build/optional-components')) {
                const optionalZips = fs.readdirSync('build/optional-components').filter(f => f.endsWith('.zip'));
                if (optionalZips.length > 0) {
                  comment += `### 📚 Optional Components (${optionalZips.length})\n\n`;
                  for (const zip of optionalZips) {
                    const stats = fs.statSync(`build/optional-components/${zip}`);
                    const sizeMB = (stats.size / 1024 / 1024).toFixed(2);
                    comment += `- \`build/optional-components/${zip}\` (${sizeMB} MB)\n`;
                  }
                  comment += `\n`;
                }
              }
            }
            
            comment += `\n---\n`;
            comment += `💡 **For WordPress.org plugins:** Built files are committed to ensure the plugin works immediately after installation.\n`;
            comment += `\nDownload artifacts from the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) to test.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Build production autoloader
        run: composer install --no-dev --classmap-authoritative --no-interaction

      - name: Build summary
        if: always()
        run: |
          echo "## 🏗️ WordPress Plugin Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "build" ] && [ "$(ls -A build/*.zip 2>/dev/null)" ]; then
            echo "### 📦 Plugin Distributions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
            for zip in build/*.zip; do
              name=$(basename "$zip")
              size=$(du -h "$zip" | cut -f1)
              echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
            done
          fi

          if [ -d "build/toolkit-addons" ] && [ "$(ls -A build/toolkit-addons/*.zip 2>/dev/null)" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🧰 Toolkit Add-ons" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
            for zip in build/toolkit-addons/*.zip; do
              name=$(basename "$zip")
              size=$(du -h "$zip" | cut -f1)
              echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
            done
          fi

          if [ -d "build/optional-components" ] && [ "$(ls -A build/optional-components/*.zip 2>/dev/null)" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📚 Optional Components (On-Demand Downloads)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
            for zip in build/optional-components/*.zip; do
              name=$(basename "$zip")
              size=$(du -h "$zip" | cut -f1)
              echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
            done
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Built files are committed per WordPress.org standards*" >> $GITHUB_STEP_SUMMARY
