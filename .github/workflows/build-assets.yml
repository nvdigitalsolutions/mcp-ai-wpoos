# Build Plugin Assets & Distributions
#
# WordPress Plugin Standard Build Process
#
# For WordPress plugins, minified CSS/JS and vendor libraries are COMMITTED
# to the repository because WordPress.org SVN requires production-ready code
# and users install directly without build steps.
#
# Plugin distribution ZIP files are NOT committed to git — they are uploaded
# as GitHub Actions artifacts and, on tagged releases, as GitHub Release assets
# (see release.yml). Keeping ZIPs out of git history prevents large binary
# blobs from accumulating in .git/objects, which was causing oversized git
# object directories in Cloudways and other deployment clones.
#
# This follows WordPress Plugin Handbook best practices:
# https://developer.wordpress.org/plugins/wordpress-org/how-to-use-subversion/
#
# Author: NV Digital Solutions (https://nvdigitalsolutions.com/)

name: Build Assets & Distributions

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'copilot/**'
    paths:
      # Rebuild when source files change
      - 'assets/js/**/*.js'
      - 'assets/css/**/*.css'
      - '!assets/**/*.min.js'
      - '!assets/**/*.min.css'
      - 'includes/**/*.php'
      - 'addons/**/*.php'
      - '*.php'
      - 'composer.json'
      - 'package.json'
      - 'bin/build-plugin-zip.sh'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'assets/js/**/*.js'
      - 'assets/css/**/*.css'
      - 'includes/**/*.php'
      - 'addons/**/*.php'
      - '*.php'
      - 'composer.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PLUGIN_SLUG: wp-mcp-ai

jobs:
  # =============================================================================
  # Build Everything (WordPress Standard)
  # =============================================================================
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, mysqli, zip
          tools: composer:v2

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci
          echo "✅ Node dependencies installed"

      - name: Build frontend assets
        run: |
          echo "🎨 Building CSS and JavaScript..."
          npm run build
          echo "✅ Frontend assets built"
          
          echo ""
          echo "📊 Build output:"
          find assets -name "*.min.css" -o -name "*.min.js" | sort

      - name: Build plugin distributions
        run: |
          echo "🔨 Building all 8 plugin ZIP files..."
          chmod +x bin/rebuild-all-zips.sh
          ./bin/rebuild-all-zips.sh --skip-npm-build
          
          echo ""
          echo "📦 All plugin distributions (8 total):"
          ls -lh build/*.zip

      - name: Check for changes
        id: check_changes
        run: |
          # Add all built assets (CSS/JS only; ZIPs are not committed — see header)
          git add -f assets/**/*.min.css assets/**/*.min.css.map 2>/dev/null || true
          git add -f assets/**/*.min.js assets/**/*.min.js.map 2>/dev/null || true
          
          # Check if anything changed
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ No changes to built files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Built files have been updated:"
            git diff --staged --stat
          fi

      - name: Commit built files (WordPress standard)
        if: |
          github.event_name == 'push' &&
          steps.check_changes.outputs.changed == 'true' &&
          !contains(github.event.head_commit.message, '[skip ci]') &&
          !contains(github.event.head_commit.message, '[skip build]')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Commit with descriptive message
          git commit -m "build: update compiled assets [skip ci]

          - Rebuilt minified CSS/JS from source files
          - Ready for WordPress.org deployment
          
          Auto-generated by GitHub Actions"
          
          # Disable CRLF normalization so that vendor files with CRLF line endings
          # (addons/pro/assets/vendor/**) do not appear as unstaged changes on Linux CI.
          # Without this, git stash saves the changes but restores the same CRLF files,
          # which immediately re-appear as modified and block git pull --rebase.
          git config core.autocrlf false
          
          # Discard any CRLF-only unstaged changes in tracked files so the rebase is clean
          git checkout -- . 2>/dev/null || true
          
          # Pull and rebase to handle any new commits pushed while building.
          # --autostash handles any remaining unstaged changes automatically.
          git pull --rebase --autostash origin ${{ github.ref_name }} || {
            echo "⚠️ Rebase conflict detected. Aborting..."
            git rebase --abort
            exit 1
          }
          
          git push

      - name: Upload plugin distributions as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distributions-${{ github.ref_name }}-${{ github.sha }}
          path: build/*.zip
          retention-days: 30

      - name: Comment on PR with build results
        if: github.event_name == 'pull_request' && steps.check_changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            // Get list of changed files
            const changedFiles = execSync('git diff --staged --name-only').toString().trim().split('\n');
            const assets = changedFiles.filter(f => f.includes('.min.'));
            
            let comment = `## 📦 Build Results\n\n`;
            comment += `The plugin has been rebuilt with your changes.\n\n`;
            
            if (assets.length > 0) {
              comment += `### 🎨 Updated Assets (${assets.length} files)\n\n`;
              comment += assets.slice(0, 10).map(f => `- \`${f}\``).join('\n');
              if (assets.length > 10) comment += `\n- ...and ${assets.length - 10} more`;
              comment += `\n\n`;
            }
            
            // Report built ZIPs even though they are not committed to git
            if (fs.existsSync('build')) {
              const zipFiles = fs.readdirSync('build').filter(f => f.endsWith('.zip'));
              if (zipFiles.length > 0) {
                comment += `### 📦 Plugin Distributions (uploaded as artifacts)\n\n`;
                for (const zip of zipFiles) {
                  const stats = fs.statSync(`build/${zip}`);
                  const sizeMB = (stats.size / 1024 / 1024).toFixed(2);
                  comment += `- \`${zip}\` (${sizeMB} MB)\n`;
                }
                comment += `\n`;
              }
            }
            
            comment += `\n---\n`;
            comment += `💡 **Plugin distribution ZIPs** are uploaded as GitHub Actions artifacts (not committed to git) to keep the repository lean.\n`;
            comment += `\nDownload artifacts from the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) to test.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Build production autoloader
        run: composer install --no-dev --classmap-authoritative --no-interaction

      - name: Build summary
        if: always()
        run: |
          echo "## 🏗️ WordPress Plugin Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "build" ] && [ "$(ls -A build/*.zip 2>/dev/null)" ]; then
            echo "### 📦 Plugin Distributions (artifacts, not committed to git)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
            for zip in build/*.zip; do
              name=$(basename "$zip")
              size=$(du -h "$zip" | cut -f1)
              echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
            done
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Distribution ZIPs are uploaded as GitHub Actions artifacts (not committed to git) to keep the repository lean.*" >> $GITHUB_STEP_SUMMARY
