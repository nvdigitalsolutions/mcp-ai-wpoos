# NV oOS Toolkit SPA — Bundle Size Guardrail
#
# Builds each toolkit-SPA addon and verifies the gzipped JS bundle stays
# within its tier threshold (blueprint §16):
#
#   Tier A  toolkit-shell         ≤ 200 KB gzip
#   Tier B  canvas-toolkit        ≤ 1600 KB gzip (specialist canvas — tldraw + bpmn-js + mermaid)
#   Tier C  document-editor       ≤ 500 KB gzip  (v0.2.0: Tiptap + GrapesJS site-creator mode)
#   Tier D  media-studio          ≤ 900 KB gzip  (specialist shell — higher tolerance)
#   Tier E  chat-spa              ≤ 350 KB gzip
#   Docs    docs-hub              ≤ 250 KB gzip  (React + FlexSearch + rehype-highlight)
#   Docs    cloudways-dashboard   ≤ 200 KB gzip  (Velzon-themed React SPA)
#   Docs    comic-reader          ≤ 200 KB gzip  (React-based comic reader)
#   SPA     schedule-anything-spa ≤ 150 KB gzip  (main chunk — Vite/Tailwind build; Builder lazy chunk ~64 KB)
#
# Failures are blocking. The job prints the actual size alongside the limit so
# contributors know how much headroom remains.

name: SPA Bundle Size

on:
  push:
    branches: [ main ]
    paths:
      - 'addons/toolkit-shell/src/**'
      - 'addons/toolkit-shell/esbuild.config.cjs'
      - 'addons/toolkit-shell/package.json'
      - 'addons/canvas-toolkit/src/**'
      - 'addons/canvas-toolkit/esbuild.config.cjs'
      - 'addons/canvas-toolkit/package.json'
      - 'addons/document-editor/src/**'
      - 'addons/document-editor/esbuild.config.cjs'
      - 'addons/document-editor/package.json'
      - 'addons/media-studio/src/**'
      - 'addons/media-studio/esbuild.config.cjs'
      - 'addons/media-studio/package.json'
      - 'addons/docs-hub/src/**'
      - 'addons/docs-hub/esbuild.config.js'
      - 'addons/docs-hub/package.json'
      - 'addons/chat-spa/src/**'
      - 'addons/chat-spa/esbuild.config.cjs'
      - 'addons/chat-spa/package.json'
      - 'addons/cloudways-dashboard/src/**'
      - 'addons/cloudways-dashboard/esbuild.config.cjs'
      - 'addons/cloudways-dashboard/package.json'
      - 'addons/comic-reader/src/**'
      - 'addons/comic-reader/esbuild.config.cjs'
      - 'addons/comic-reader/package.json'
      - 'addons/schedule-anything-spa/src/**'
      - 'addons/schedule-anything-spa/vite.config.ts'
      - 'addons/schedule-anything-spa/package.json'
  pull_request:
    paths:
      - 'addons/toolkit-shell/src/**'
      - 'addons/toolkit-shell/esbuild.config.cjs'
      - 'addons/toolkit-shell/package.json'
      - 'addons/canvas-toolkit/src/**'
      - 'addons/canvas-toolkit/esbuild.config.cjs'
      - 'addons/canvas-toolkit/package.json'
      - 'addons/document-editor/src/**'
      - 'addons/document-editor/esbuild.config.cjs'
      - 'addons/document-editor/package.json'
      - 'addons/media-studio/src/**'
      - 'addons/media-studio/esbuild.config.cjs'
      - 'addons/media-studio/package.json'
      - 'addons/docs-hub/src/**'
      - 'addons/docs-hub/esbuild.config.js'
      - 'addons/docs-hub/package.json'
      - 'addons/chat-spa/src/**'
      - 'addons/chat-spa/esbuild.config.cjs'
      - 'addons/chat-spa/package.json'
      - 'addons/cloudways-dashboard/src/**'
      - 'addons/cloudways-dashboard/esbuild.config.cjs'
      - 'addons/cloudways-dashboard/package.json'
      - 'addons/comic-reader/src/**'
      - 'addons/comic-reader/esbuild.config.cjs'
      - 'addons/comic-reader/package.json'
      - 'addons/schedule-anything-spa/src/**'
      - 'addons/schedule-anything-spa/vite.config.ts'
      - 'addons/schedule-anything-spa/package.json'

jobs:
  bundle-size:
    name: bundle size (${{ matrix.addon }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: toolkit-shell
            limit_kb: 200
          - addon: canvas-toolkit
            limit_kb: 1650  # tldraw (whiteboard) + bpmn-js (BPMN) + mermaid (live preview) are heavy specialist deps
          - addon: document-editor
            limit_kb: 500  # v0.2.0 ships site-creator mode (GrapesJS); heavier than base Tiptap editor
          - addon: media-studio
            limit_kb: 900
          - addon: docs-hub
            limit_kb: 250  # React + FlexSearch + rehype-highlight common languages
          - addon: chat-spa
            limit_kb: 350  # Vercel AI SDK UI (@ai-sdk/react) + React 19 baseline
          - addon: cloudways-dashboard
            limit_kb: 200
          - addon: comic-reader
            limit_kb: 200
          - addon: schedule-anything-spa
            limit_kb: 150  # main chunk (index-*.js) — Vite build; lazy Builder chunk ~64 KB

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: addons/${{ matrix.addon }}/package-lock.json

      - name: Install dependencies
        working-directory: addons/${{ matrix.addon }}
        run: npm ci

      - name: Build production bundle
        working-directory: addons/${{ matrix.addon }}
        run: npm run build

      - name: Check gzipped JS bundle size
        shell: bash
        run: |
          ADDON="${{ matrix.addon }}"
          LIMIT_KB="${{ matrix.limit_kb }}"
          LIMIT_BYTES=$(( LIMIT_KB * 1024 ))

          # Pattern-B Vite builds (schedule-anything-spa) emit hashed chunks
          # under assets/dist/assets/ — guard the main entry chunk, which
          # every route loads (lazy chunks load on demand).
          if [ "${ADDON}" = "schedule-anything-spa" ]; then
            BUNDLE=$(ls "addons/${ADDON}/assets/dist/assets"/index-*.js 2>/dev/null | head -n1)
          else
            BUNDLE="addons/${ADDON}/assets/dist/${ADDON}.js"
          fi

          if [ -z "${BUNDLE}" ] || [ ! -f "${BUNDLE}" ]; then
            echo "::error::Bundle not found for ${ADDON} (expected assets/dist/<slug>.js or assets/dist/assets/index-*.js)"
            exit 1
          fi

          GZ_BYTES=$(gzip -c "${BUNDLE}" | wc -c)
          GZ_KB=$(( GZ_BYTES / 1024 ))
          HEADROOM_KB=$(( LIMIT_KB - GZ_KB ))

          echo "=== ${ADDON} bundle size ==="
          echo "  Gzipped : ${GZ_KB} KB  (${GZ_BYTES} bytes)"
          echo "  Limit   : ${LIMIT_KB} KB"
          echo "  Headroom: ${HEADROOM_KB} KB"

          if [ "${GZ_BYTES}" -gt "${LIMIT_BYTES}" ]; then
            echo "::error::${ADDON} gzipped bundle (${GZ_KB} KB) exceeds the ${LIMIT_KB} KB limit. Reduce bundle size before merging."
            exit 1
          fi

          echo "::notice::${ADDON} gzipped bundle is ${GZ_KB} KB — ${HEADROOM_KB} KB under the ${LIMIT_KB} KB limit."
