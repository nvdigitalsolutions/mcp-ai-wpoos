name: Sync nvoos-forge-bridge

on:
  workflow_dispatch:
  push:
    branches: [main, alpha-working]
    paths:
      - 'plugins/nvoos-forge-bridge/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split subtree
        run: |
          git subtree split --prefix=plugins/nvoos-forge-bridge --branch=nvoos-forge-bridge-split

      - name: Push to nvoos-forge-bridge
        env:
          NVOOS_FORGE_BRIDGE_DEPLOY_KEY: ${{ secrets.NVOOS_FORGE_BRIDGE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$NVOOS_FORGE_BRIDGE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git push git@github.com:nvdigitalsolutions/nvoos-forge-bridge.git nvoos-forge-bridge-split:main --force
