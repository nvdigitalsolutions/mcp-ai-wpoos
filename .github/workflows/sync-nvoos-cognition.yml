name: Sync nvoos-cognition

# One-way mirror of the NV oOS Cognition desktop app (examples/nvoos-dictate)
# to the public repo nvdigitalsolutions/nvoos-cognition.
#
# Each sync snapshots HEAD's subtree as ONE root commit and force-pushes it:
# the mirror history is intentionally flat (one commit per sync). Never
# commit to the mirror directly; the monorepo copy at examples/nvoos-dictate
# is the source of truth. The mirror carries the app's proprietary
# LICENSE.txt (LicenseRef-Proprietary) — it is a source-visible but NOT
# open-source distribution.
#
# 2026-11-04: the old subtree-split step needed fetch-depth: 0, and the
# monorepo pack is ~38 GiB (build artifacts committed over time), so the
# full clone kept dying in Checkout (fetch-pack early EOF). Same fix as the
# gateway sync (#7421): shallow checkout + a commit-tree snapshot — nothing
# here needs history.
#
# The app's technical identifiers stay `nvoos-dictate` (crate, binary,
# updater tags, data dirs) while the product brand is NV oOS Cognition —
# see docs/project/proposals/103-nvoos-cognition-rebrand-proposal.md.
#
# Activation (owner steps, one-time):
#   1. Create the repo nvdigitalsolutions/nvoos-cognition (public).
#   2. Add a repo-scoped deploy token as the repository secret
#      NVOOS_COGNITION_REPO_TOKEN.
#   3. Run this workflow once via workflow_dispatch (backfills the mirror).
#   4. Verify the mirror's README renders (brand name, features list).

on:
  push:
    branches: [main, alpha-working]
    paths:
      - 'examples/nvoos-dictate/**'
  # Manual runs let you force a sync without waiting for a merge (first-run
  # verification after adding the token, backfills, etc.).
  workflow_dispatch:

# Newest run wins. A sync snapshots the full subtree content at HEAD, so an
# older in-flight sync can never contain anything the newer one lacks.
concurrency:
  group: sync-nvoos-cognition
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Depth 1 is enough: the mirror step snapshots HEAD's subtree and
          # reads only HEAD's commit message — nothing needs history. The
          # monorepo pack is ~38 GiB (build artifacts committed over time),
          # so fetch-depth: 0 makes this step clone for ages (2026-11-04:
          # checkout died with fetch-pack early EOF on the full clone).
          fetch-depth: 1

      - name: Mirror the subtree with a flat snapshot commit
        env:
          TOKEN: ${{ secrets.NVOOS_COGNITION_REPO_TOKEN }}
        run: |
          set -euo pipefail

          # The ambient GITHUB_TOKEN extraheader would override the token
          # URL auth below — drop it for the rest of the job.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'

          MIRROR_URL="https://x-access-token:${TOKEN}@github.com/nvdigitalsolutions/nvoos-cognition.git"
          MSG="$(git log -1 --format='%s%n%n%b' -- examples/nvoos-dictate)"
          MSG="${MSG:-Sync nvoos-cognition from mcp-ai-wpoos@${GITHUB_SHA}}"
          TREE="$(git rev-parse HEAD:examples/nvoos-dictate)"
          INCOMING_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('examples/nvoos-dictate/package.json','utf8')).version")"

          # Version guard: never let a stale branch promotion (or an
          # out-of-order sync run) roll the public mirror backwards. The
          # mirror's package.json sits at its repo root. A fetch failure
          # (e.g. an empty mirror on first backfill) skips the guard.
          if git fetch --quiet --depth=1 "$MIRROR_URL" main 2>/dev/null; then
            MIRROR_VERSION="$(git show FETCH_HEAD:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)"
            if [ -n "$MIRROR_VERSION" ] \
              && [ "$INCOMING_VERSION" != "$MIRROR_VERSION" ] \
              && [ "$(printf '%s\n%s\n' "$INCOMING_VERSION" "$MIRROR_VERSION" | sort -V | head -n1)" = "$INCOMING_VERSION" ]; then
              echo "::notice::Skipping — incoming ${INCOMING_VERSION} is older than the mirror's ${MIRROR_VERSION} (stale branch promotion)"
              exit 0
            fi
          fi

          # Root commit (no parent): the mirror stays flat, one commit per
          # sync, force-pushed.
          # Root commit (no parent): the mirror stays flat, one commit per
          # sync, force-pushed. The fully-qualified dst also creates the
          # branch on the first backfill into an empty mirror.
          SYNC_COMMIT="$(printf '%s\n' "$MSG" | git commit-tree "$TREE")"
          git push --quiet "$MIRROR_URL" "$SYNC_COMMIT:refs/heads/main" --force
          echo "Pushed ${SYNC_COMMIT} to nvoos-cognition:main"
