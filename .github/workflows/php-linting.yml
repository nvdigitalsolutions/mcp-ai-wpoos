name: PHP Linting

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  wpcs:
    name: WordPress Coding Standards (WPCS 3.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Get changed PHP files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.php
          files_ignore: |
            vendor/**
            node_modules/**
            assets/examples/**

      - name: Run WPCS on changed files
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Changed PHP files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"
          
          # Run PHPCS with phpcs.xml.dist configuration (includes WPCS 3.0)
          PHPCS_OUTPUT=$(vendor/bin/phpcs --standard=phpcs.xml.dist --report=json ${{ steps.changed-files.outputs.all_changed_files }} 2>&1 || true)
          
          # Extract only the JSON part (last line containing valid JSON)
          JSON_OUTPUT=$(echo "$PHPCS_OUTPUT" | grep -E '^\{' | tail -1)
          
          if [ -z "$JSON_OUTPUT" ]; then
            echo "No JSON output from PHPCS. Full output:"
            echo "$PHPCS_OUTPUT"
            echo "✅ No issues found or unable to parse output"
            exit 0
          fi
          
          echo "$JSON_OUTPUT"
          
          # Parse errors and warnings
          ERRORS=$(echo "$JSON_OUTPUT" | jq -r '.totals.errors // 0')
          WARNINGS=$(echo "$JSON_OUTPUT" | jq -r '.totals.warnings // 0')
          FIXABLE=$(echo "$JSON_OUTPUT" | jq -r '.totals.fixable // 0')
          
          echo "WPCS Results: $ERRORS errors, $WARNINGS warnings ($FIXABLE auto-fixable)"
          
          # Set threshold based on current baseline (1175 total errors / 269 files ≈ 4 per file)
          # Allow max 10 errors per changed file as improvement target
          MAX_ERRORS_PER_FILE=10
          NUM_FILES=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | wc -w)
          MAX_ERRORS=$((NUM_FILES * MAX_ERRORS_PER_FILE))
          
          if [ "$ERRORS" -gt "$MAX_ERRORS" ]; then
            echo "❌ Too many WPCS errors: $ERRORS (maximum allowed: $MAX_ERRORS for $NUM_FILES files)"
            echo "💡 Tip: Run 'composer run format' to auto-fix $FIXABLE violations"
            exit 1
          elif [ "$ERRORS" -gt 0 ]; then
            echo "⚠️ Found $ERRORS WPCS errors (below threshold of $MAX_ERRORS)"
            if [ "$FIXABLE" -gt 0 ]; then
              echo "💡 Run 'composer run format' to auto-fix $FIXABLE violations"
            fi
          else
            echo "✅ No WPCS errors found"
          fi

      - name: Run WPCS on all files
        if: github.event_name == 'push'
        run: |
          # Run PHPCS with phpcs.xml.dist (uses WPCS 3.0)
          # Call phpcs directly to get clean JSON output (composer adds extra text)
          PHPCS_OUTPUT=$(vendor/bin/phpcs --report=json 2>&1 || true)
          
          # Extract only the JSON part (last line containing valid JSON)
          JSON_OUTPUT=$(echo "$PHPCS_OUTPUT" | grep -E '^\{' | tail -1)
          
          if [ -z "$JSON_OUTPUT" ]; then
            echo "No JSON output from PHPCS. Full output:"
            echo "$PHPCS_OUTPUT"
            echo "✅ No issues found or unable to parse output"
            exit 0
          fi
          
          echo "$JSON_OUTPUT"
          
          # Parse errors and warnings
          ERRORS=$(echo "$JSON_OUTPUT" | jq -r '.totals.errors // 0')
          WARNINGS=$(echo "$JSON_OUTPUT" | jq -r '.totals.warnings // 0')
          FIXABLE=$(echo "$JSON_OUTPUT" | jq -r '.totals.fixable // 0')
          
          echo "WPCS Results: $ERRORS errors, $WARNINGS warnings ($FIXABLE auto-fixable)"
          echo "📊 Baseline: 1175 errors (target: continuous improvement)"
          
          # Current baseline threshold - will be gradually reduced
          MAX_ERRORS=1200
          
          if [ "$ERRORS" -gt "$MAX_ERRORS" ]; then
            echo "❌ WPCS errors increased: $ERRORS (regression threshold: $MAX_ERRORS)"
            echo "💡 Run 'composer run format' to auto-fix $FIXABLE violations"
            exit 1
          elif [ "$ERRORS" -gt 1175 ]; then
            echo "⚠️ WPCS errors slightly increased: $ERRORS (baseline: 1175)"
            echo "Please review and fix new violations"
          elif [ "$ERRORS" -lt 1175 ]; then
            echo "✅ WPCS compliance improved! $ERRORS errors (was 1175)"
            echo "🎉 Improvement: $((1175 - ERRORS)) errors fixed"
          else
            echo "📊 WPCS stable at baseline: $ERRORS errors"
          fi

  php-compatibility:
    name: PHP Compatibility Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Get changed PHP files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.php
          files_ignore: |
            vendor/**
            node_modules/**
            assets/examples/**

      - name: Run PHP Compatibility Check on changed files
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Changed PHP files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"
          vendor/bin/phpcs --standard=PHPCompatibilityWP --runtime-set testVersion 7.4-8.3 ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Run PHP Compatibility Check on all files
        if: github.event_name == 'push'
        run: composer run lint:compat
