    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "php"
      - "algorave"
    reviewers:
      - "nvdigitalsolutions"
    commit-message:
      prefix: "composer(algorave)"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "nvdigitalsolutions"
    commit-message:
      prefix: "ci"
      include: "scope"
