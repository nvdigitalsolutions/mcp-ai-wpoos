name: Graphify CI

on:
  push:
    branches: [main, alpha-working]
    paths:
      - 'plugins/nvoos-graphify/**'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/nvoos-graphify/**'

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} · WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        wp: ['6.5', '6.6', '6.7', '6.8', '6.9']
        exclude:
          - php: '8.1'
            wp: '6.9'
          - php: '8.3'
            wp: '6.5'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, json, mbstring
          coverage: none

      - name: Install Composer dependencies
        working-directory: plugins/nvoos-graphify
        run: composer install --no-interaction --prefer-dist

      - name: Setup WordPress test suite
        working-directory: plugins/nvoos-graphify
        run: |
          bash bin/install-wp-tests.sh wordpress_test root wordpress 127.0.0.1 ${{ matrix.wp }} true

      - name: Run unit tests
        working-directory: plugins/nvoos-graphify
        run: composer run test:unit

  lint:
    name: PHP Lint + Code Sniffer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install Composer dependencies
        working-directory: plugins/nvoos-graphify
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax check
        working-directory: plugins/nvoos-graphify
        run: |
          find src/ tests/ -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l nvoos-graphify.php
          php -l uninstall.php

      - name: PHP Code Sniffer
        working-directory: plugins/nvoos-graphify
        run: composer run lint || true
