[package]
name = "nvoos-dictate"
version = "0.3.0"
description = "NV oOS Cognition — local-first push-to-talk dictation, screen OCR and meeting transcription companion for the NV oOS WordPress plugin."
authors = ["NV Digital Solutions"]
edition = "2021"
license = "proprietary"
rust-version = "1.90"
repository = "https://github.com/nvdigitalsolutions/mcp-ai-wpoos"
default-run = "nvoos-dictate"

# Tauri requires a specific crate-type layout for the mobile-ready lib/main split.
[lib]
name = "nvoos_dictate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nvoos-dictate"
path = "src/main.rs"

# Vision detector spike (Proposal 075) — needs the `vision` feature (ort + ndarray16).
[[example]]
name = "vision_probe"
path = "examples/vision_probe.rs"
required-features = ["vision"]

# Browser-agent de-risk spike (Phase 0) — proves a local model can emit a
# parseable tool call through the existing LocalOpenAiProvider transport.
[[example]]
name = "agent_probe"
path = "examples/agent_probe.rs"
required-features = ["agent"]

# Screenshot-OCR de-risk spike (Proposal 100, M0): WinRT OcrEngine leg
# (default features) + RapidOCR-ONNX leg (behind `snippet-onnx`).
[[example]]
name = "snippet_ocr_probe"
path = "examples/snippet_ocr_probe.rs"
required-features = ["snippet"]

# Document-input de-risk spike (Proposal 109, M0): PDF text extraction +
# 300-DPI rendering via pdfium-render (feature `document`).
[[example]]
name = "document_probe"
path = "examples/document_probe.rs"
required-features = ["document"]

# Document-model tier probe (Proposal 111): one page -> local DeepSeek-OCR
# server -> Markdown. Requires the `document` feature (image/pdfium deps).
[[example]]
name = "document_model_probe"
path = "examples/document_model_probe.rs"
required-features = ["document"]

# Memory-layer de-risk spike (Proposal 127, M0): downloads the pinned granite
# embedder files, loads tokenizer + ort session, and embeds fixture sentences
# (dim, RTF, cross-lingual cosine sanity). Requires the `memory` feature.
[[example]]
name = "embed_probe"
path = "examples/embed_probe.rs"
required-features = ["memory"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
rusqlite_migration = "1"
# Memory layer (Proposal 127): vec0 virtual tables live in the shared SQLite
# database. NON-optional on purpose — the `chunk_vectors` table is created
# unconditionally in the migration list, because rusqlite_migration keys
# migrations by position and a feature-conditional migration would break
# opening a memory-enabled DB from a feature-off build. The crate is pure C
# (~a few hundred KB) and loads via `Connection::load_extension("vec0",
# sqlite3_vec_init)`; pinned exactly because sqlite-vec is pre-v1 and the
# vec0 API has shifted between 0.1.x releases.
sqlite-vec = "=0.1.9"
keyring = "3"
cpal = "0.15"
arboard = "3"
enigo = "0.6"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
# Audio file decoding (Transcribe file…): pure Rust, no FFmpeg sidecar.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "flac", "vorbis", "ogg", "pcm", "wav", "isomp4"] }

# Feature-gated native engines + integrations. The default build ships the
# deterministic MockEngine so the full pipeline (hotkey -> audio -> cleanup ->
# paste -> history) is testable without C++ toolchains or model downloads.
#
#   cargo build --features parakeet,whisper,mcp
#
# NOTE: `sherpa-onnx` is the OFFICIAL k2-fsa Rust API (sherpa-rs is
# deprecated). Its exact surface must be re-verified against
# https://docs.rs/sherpa-onnx at first compile of the `parakeet` feature —
# the calls are isolated in stt/parakeet.rs.
sherpa-onnx = { version = "1.10", optional = true }
bzip2 = { version = "0.4", optional = true }
tar = { version = "0.4", optional = true }
whisper-rs = { version = "0.16", optional = true }
# Direct optional dep purely to forward the `force-debug` feature to the
# vendored whisper-rs-sys (whisper-rs 0.16 does not forward it itself);
# unifies with the [patch.crates-io] entry below.
whisper-rs-sys = { path = "../vendor/whisper-rs-sys", optional = true }
ort = { version = "=2.0.0-rc.9", optional = true }
# Pinned to match ort rc.9 — the caret range on ort-sys otherwise drifts to
# rc.13, whose bindings are incompatible with the rc.9 high-level API.
ort-sys = { version = "=2.0.0-rc.9", optional = true }
rmcp = { version = "3.5", default-features = false, features = ["macros", "server", "transport-io"], optional = true }
# Direct dependency required by the schemars derive macro (it emits
# `schemars::…` paths); must match the series rmcp re-exports (schemars 1.x).
schemars = { version = "1", optional = true }
silero-vad-rs = { version = "0.1", optional = true }
ndarray = { version = "0.15", optional = true }
# ort rc.9's `ndarray` feature wants ndarray 0.16, while silero-vad holds 0.15.
# Alias the 0.16 series for the direct vision `ort` consumer (the lock already
# dual-versions ndarray via silero-vad's own ort dep).
ndarray16 = { package = "ndarray", version = "0.16", optional = true }
nokhwa = { version = "0.10", features = ["input-native", "camera-sync-impl"], optional = true }
# Direct dep so camera preview can name image::Rgb/ImageBuffer (nokhwa re-uses image 0.25).
image = { version = "0.25", optional = true }
# Browser-agent CDP client (Phase 1). Pure Rust, no Node subprocess; drives an
# attached system Chrome/Chromium over the DevTools Protocol. Default features
# only (no `fetcher` — v1 attaches to a discoverable system Chrome, per the
# browser-agent plan §7; Chrome-for-Testing download is a later acquisition tier).
chromiumoxide = { version = "0.9", optional = true, default-features = false }
# The StreamExt trait used to poll chromiumoxide's Handler (its own `futures`
# dependency is not re-exported; a direct dep keeps the stream poll in scope).
futures = { version = "0.3", optional = true }
# Document input pipeline (Proposal 109): PDF open/extract/render. PDFium is
# the BSD-3 engine behind Chrome/WebView2 (MuPDF/Poppler/Ghostscript are
# AGPL/GPL — incompatible with this app's license). Features pinned:
# `pdfium_7881` (API version, matches the bblanchon prebuilt binary),
# `image_025` (matches the app's image 0.25 pin — no duplicate image tree),
# `thread_safe` (Pdfium is not thread-safe; the crate serializes calls).
# The binary itself is a pinned, checksummed download — never committed (D2).
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"], optional = true }
# Multi-page TIFF page iteration (the `image` crate decodes only the first
# page). Already transitively present via image-tiff; a direct optional dep
# exposes the paged Decoder API.
tiff = { version = "0.9", optional = true }
# Searchable-PDF emitter (feature `snippet-pdf`, Proposal 102 D9 / 109 D10):
# a battle-tested low-level PDF writer — xref/stream bookkeeping is where
# hand-rolling fails silently.
lopdf = { version = "0.36", optional = true }
# Memory layer (Proposal 127): BPE tokenization for the embedder (granite
# ModernBERT tokenizer.json). 0.23 stable only — the 1.0.0-rc series is a
# re-export shim under a different internal layout. `onig` is required for
# the `\p{...}` regex the GPT-2/ModernBERT ByteLevel pretokenizer carries;
# BPE + tokenizer.json deserialization are core in this series.
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }

[target.'cfg(windows)'.dependencies]
# Low-level keyboard hook (WH_KEYBOARD_LL), GetAsyncKeyState fallback, and
# foreground-window detection for per-app cleanup profiles. See hotkey/.
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # Snippet OCR (Proposal 100): GDI virtual-screen freeze + the WinRT
  # Windows.Media.Ocr stack (PowerToys Text Extractor's engine). Feature
  # names are namespace-derived (Media_Ocr = Windows.Media.Ocr); a missing
  # feature surfaces as "cannot find module" at compile time.
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Storage_Streams",
  "Media_Ocr",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS platform layer (P5 port): event taps for modifier hold-PTT,
# CGEventPost paste injection, Accessibility trust checks, and the
# NSWorkspace frontmost-app reader for per-app cleanup profiles.
#
# core-graphics is pinned to 0.23: the 0.24 series changed the
# CGEventTap::new callback signature (user-info generic), and 0.23's
# three-argument FnMut shape is the one this port was written against.
core-graphics = "=0.23.2"
# CFRunLoop drives the event-tap thread (core-graphics re-exports it, but
# a direct dependency keeps the run-loop types in the crate's scope).
core-foundation = "=0.9.4"
# AXIsProcessTrusted checks (the crate enigo uses for its own macOS
# accessibility gate).
macos-accessibility-client = "0.0.1"
# Foreground-app detection (NSWorkspace). objc2 0.6 pairs with
# objc2-foundation/objc2-app-kit 0.3 (the version series diverged).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }

[features]
default = []
mock = []
parakeet = ["dep:sherpa-onnx", "dep:tar", "dep:bzip2"]
# The `force-debug` pass-through compiles whisper.cpp with the
# RelWithDebInfo CMake profile even in release builds: the MSVC
# "Release" configuration maps to an unoptimized vcxproj (RTF ~5 for
# base.en instead of ~0.3) — see the dictation-app skill.
whisper = ["dep:whisper-rs", "whisper-rs-sys/force-debug"]
moonshine = ["dep:ort", "dep:ort-sys"]
# NeMo FastConformer-CTC STT (sherpa-onnx `nemo_ctc` slot), same dep set
# as parakeet: sherpa-onnx for the recognizer + tar/bzip2 for the archive.
fastconformer = ["dep:sherpa-onnx", "dep:tar", "dep:bzip2"]
mcp = ["dep:rmcp", "dep:schemars"]
silero-vad = ["dep:silero-vad-rs", "dep:ort-sys", "dep:ndarray"]
# Live webcam/camera capture (Proposal 073) — video preview via nokhwa.
camera = ["dep:nokhwa", "dep:image"]
# Local object detection (Proposal 075) — ONNX YOLO via the direct ort runtime
# + ndarray 0.16. Requires the camera feature (the frame source, which pulls
# nokhwa + image) and the ort/ort-sys pair already used by moonshine/silero-vad.
vision = ["camera", "dep:ort", "dep:ort-sys", "dep:ndarray16"]
# Browser agent (dictated web control) — Phase 1 adds the CDP client.
agent = ["dep:chromiumoxide", "dep:futures"]
# Screen-to-text snippet OCR (Proposal 100): frozen-screen region capture,
# the selection overlay, and the platform-native OCR engines (Windows.Media.Ocr
# on Windows, Apple Vision via the existing mac-helper sidecar). `image`
# covers the in-memory preview PNG + crop encoding (never written to disk).
snippet = ["dep:image"]
# Portable RapidOCR (PP-OCR det+rec) ONNX backend for `snippet` — shares the
# ort/ort-sys/ndarray16 pins with `vision` (rapid-ocr-rs is NOT used: it pulls
# its own ort version and would drift the rc.9 pin).
snippet-onnx = ["snippet", "dep:ort", "dep:ort-sys", "dep:ndarray16"]
# Document input pipeline (Proposal 109): PDF + multi-page TIFF into the
# snippet OCR stack. PDFium (BSD-3) is runtime-loaded from a pinned,
# checksummed binary shipped as a bundle resource; `tiff` adds multi-page
# decode. The VLM polish pass reuses Proposal 076's transport — no new dep.
document = ["snippet", "dep:pdfium-render", "dep:tiff"]
# Memory layer (Proposal 127): local hybrid retrieval (FTS5 + vec0) over the
# capture corpus, embedded with a bundled ONNX encoder on the pinned ort.
# sqlite-vec is deliberately NOT feature-gated here (schema stability — see
# the dependency note); this feature gates the encoder (ort + tokenizers)
# and the cited-answer provider path only.
memory = ["dep:ort", "dep:ort-sys", "dep:tokenizers", "dep:ndarray16"]
# Searchable-PDF export (102 D9/D10 shared emitter): lopdf rebuilds the
# source PDF with a rendered page image + invisible text layer.
snippet-pdf = ["snippet", "dep:lopdf"]

[patch.crates-io]
whisper-rs-sys = { path = "../vendor/whisper-rs-sys" }
