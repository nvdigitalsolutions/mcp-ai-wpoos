# ───────────────────────────────────────────────
# oOS Engine → Laravel Integration Dev Environment
# ───────────────────────────────────────────────
# Start:  docker compose -f docker/docker-compose.laravel.yml up -d
# Stop:   docker compose -f docker/docker-compose.laravel.yml down -v
# Shell:  docker compose -f docker/docker-compose.laravel.yml exec app bash

name: oos-laravel

services:
  # ── PHP Application Server ──────────────────
  app:
    build:
      context: ..
      dockerfile: docker/laravel/Dockerfile
    container_name: oos-laravel-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8001:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      # oOS engine settings
      OOS_DEFAULT_PROVIDER: openai
      OOS_DEFAULT_MODEL: gpt-4o-mini
      OOS_CACHE_STORE: redis
      OOS_QUEUE_CONNECTION: redis
      OOS_STORAGE_DISK: public
      OOS_MESH_API_KEY:
    volumes:
      # Mount the whole project so lib/{core,laravel-adapter} are available
      - ../:/workspace/oos:ro
      # The app itself lives at docker/laravel/app/
      - ./laravel/app:/var/www/html
      - laravel_storage:/var/www/html/storage
      - laravel_vendor:/var/www/html/vendor
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── MySQL 8.0 ───────────────────────────────
  db:
    image: mysql:8.0
    container_name: oos-laravel-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    volumes:
      - laravel_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plaravel", "--ssl-mode=DISABLED"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (cache + queue broker) ────────────
  redis:
    image: redis:7-alpine
    container_name: oos-laravel-redis
    volumes:
      - laravel_redis:/data

volumes:
  laravel_db:
  laravel_redis:
  laravel_storage:
  laravel_vendor:
